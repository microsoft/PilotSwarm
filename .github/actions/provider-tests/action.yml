name: Provider integration tests
description: Run the public test harness with protected CI infrastructure and a
  mandatory live HorizonDB gate.
inputs:
  providers:
    default: baseline
    description: baseline, all, or horizondb
  mode:
    default: parallel
    description: parallel or sequential
  suite:
    default: ""
    description: Optional baseline suite filter
  postgres-container:
    required: true
    description: Disposable PostgreSQL service container ID
runs:
  using: composite
  steps:
    - name: Prepare private test configuration
      run: node .github/scripts/prepare-ci-tests.mjs
      shell: bash
    - name: Configure PostgreSQL connection capacity
      env:
        PGPASSWORD: postgres
      run: >
        psql -h localhost -U postgres -d durable_copilot -c 'ALTER SYSTEM SET
        max_connections = 1500'

        docker restart "${{ inputs.postgres-container }}"

        for attempt in {1..30}; do
          if pg_isready -h localhost -U postgres; then exit 0; fi
          sleep 2
        done

        exit 1
      shell: bash
    - name: Open temporary access to dedicated CI HorizonDB
      if: inputs.providers != 'baseline'
      run: node .github/scripts/azure-ci-database.mjs open
      shell: bash
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Build
      run: npm run build
      shell: bash
    - name: Run tests
      env:
        TEST_MODE: ${{ inputs.mode }}
        TEST_SUITE: ${{ inputs.suite }}
        TEST_PROVIDERS: ${{ inputs.providers }}
      run: >
        if [[ "$TEST_SUITE" == -* ]]; then
            echo "Suite must be a test-name filter. Select provider coverage with the providers input." >&2
            exit 1
        fi

        if [ "$TEST_PROVIDERS" != "baseline" ]; then
            node .github/scripts/run-all-providers.mjs
            exit "$?"
        fi

        ARGS=()

        if [ "$TEST_MODE" = "sequential" ]; then
            ARGS+=(--sequential)
        fi

        if [ -n "$TEST_SUITE" ]; then
            ARGS+=("$TEST_SUITE")
        fi

        ./scripts/run-tests.sh "${ARGS[@]}"
      shell: bash
    - name: Remove temporary CI database access
      if: always() && inputs.providers != 'baseline'
      run: node .github/scripts/azure-ci-database.mjs close
      shell: bash
    - name: Remove runner credentials
      if: always()
      run: rm -f .env .model_providers.json
      shell: bash
