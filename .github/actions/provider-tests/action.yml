name: Provider integration tests
description: Run the public test harness with protected CI infrastructure and a
  mandatory live HorizonDB gate.
inputs:
  working-directory:
    default: "."
    description: Source checkout to install and test; controls stay in the action checkout
  source-sha:
    default: ""
    description: Tested source SHA (defaults to the workflow SHA for normal main/release runs)
  providers:
    default: baseline
    description: baseline, all, or horizondb
  mode:
    default: parallel
    description: parallel or sequential
  suite:
    default: ""
    description: Optional baseline suite filter or exact SDK file paths for HDB diagnostics
  hdb-diagnostic:
    default: "false"
    description: Run only the specified HDB SDK files; never qualifies as a release gate
  qualify-failures:
    default: "false"
    description: After complete coverage, accept one sequential verification of at most five failed cases total
  postgres-container:
    required: true
    description: Disposable PostgreSQL service container ID
runs:
  using: composite
  steps:
    - name: Prepare private test configuration
      working-directory: ${{ inputs.working-directory }}
      run: node "${{ github.action_path }}/../../scripts/prepare-ci-tests.mjs"
      shell: bash
    - name: Configure PostgreSQL connection capacity
      env:
        PGPASSWORD: postgres
      run: >
        psql -h localhost -U postgres -d durable_copilot -c 'ALTER SYSTEM SET
        max_connections = 1500'

        docker restart "${{ inputs.postgres-container }}"

        for attempt in {1..30}; do
          if pg_isready -h localhost -U postgres; then exit 0; fi
          sleep 2
        done

        exit 1
      shell: bash
    - name: Open temporary access to dedicated CI HorizonDB
      if: inputs.providers != 'baseline'
      run: node "${{ github.action_path }}/../../scripts/azure-ci-database.mjs" open
      shell: bash
    - name: Install dependencies
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
      run: GITHUB_SHA="$TEST_SOURCE_SHA" npm ci
      shell: bash
    - name: Build
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
      run: GITHUB_SHA="$TEST_SOURCE_SHA" npm run build
      shell: bash
    - name: Run tests
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
        CI_CONTROL_SCRIPTS: ${{ github.action_path }}/../../scripts
        TEST_MODE: ${{ inputs.mode }}
        TEST_SUITE: ${{ inputs.suite }}
        TEST_PROVIDERS: ${{ inputs.providers }}
        TEST_HDB_DIAGNOSTIC: ${{ inputs.hdb-diagnostic }}
        TEST_QUALIFY_FAILURES: ${{ inputs.qualify-failures }}
      run: |
        # Reports describe the tested checkout, not the workflow's main commit.
        export GITHUB_SHA="$TEST_SOURCE_SHA"

        if [[ "$TEST_SUITE" == -* ]]; then
            echo "Suite must be a test-name filter. Select provider coverage with the providers input." >&2
            exit 1
        fi

        if [ "$TEST_PROVIDERS" != "baseline" ]; then
            node "$CI_CONTROL_SCRIPTS/ci-health.mjs" &
            health_pid=$!
            trap 'kill -TERM "$health_pid"; wait "$health_pid"' EXIT
            if [ "$TEST_HDB_DIAGNOSTIC" = "true" ]; then
                node "$CI_CONTROL_SCRIPTS/run-all-providers.mjs" diagnose-hdb
            else
                node "$CI_CONTROL_SCRIPTS/run-all-providers.mjs"
            fi
            exit "$?"
        fi

        ARGS=()

        if [ "$TEST_MODE" = "sequential" ]; then
            ARGS+=(--sequential)
        fi

        if [ -n "$TEST_SUITE" ]; then
            ARGS+=("$TEST_SUITE")
        fi

        ./scripts/run-tests.sh "${ARGS[@]}"
      shell: bash
    - name: Remove temporary CI database access
      if: always() && inputs.providers != 'baseline'
      run: node "${{ github.action_path }}/../../scripts/azure-ci-database.mjs" close
      shell: bash
    - name: Remove runner credentials
      if: always()
      working-directory: ${{ inputs.working-directory }}
      run: rm -f .env .model_providers.json
      shell: bash
