name: Deploy Azure stamp
description: Build and reconcile worker and portal from the checked-out,
  immutable source commit.
inputs:
  reconcile-release-config:
    default: "false"
    description: Reconcile current templates and configuration without building or pushing release images
  image-tag:
    default: ""
    description: Verified release commit image tag; required for configuration-only reconciliation
runs:
  using: composite
  steps:
    - name: Install workspace dependencies
      run: npm ci
      shell: bash
    - name: Prepare ignored stamp configuration
      run: node deploy/scripts/prepare-github-env.mjs
      shell: bash
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.34.0
    - name: Setup ORAS
      uses: oras-project/setup-oras@v1
      with:
        version: 1.3.0
    - name: Setup Flux CLI
      shell: bash
      run: |
        curl --fail --location --silent --show-error \
          https://github.com/fluxcd/flux2/releases/download/v2.9.5/flux_2.9.5_linux_amd64.tar.gz \
          --output "$RUNNER_TEMP/flux.tar.gz"
        echo 'b853df82adfd7736f580692f9f734473d571606307139f8fd20c2a80dd1ff473  '"$RUNNER_TEMP/flux.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/flux.tar.gz" -C "$RUNNER_TEMP" flux
        sudo install -m 0755 "$RUNNER_TEMP/flux" /usr/local/bin/flux
    - name: Deploy
      shell: bash
      env:
        RECONCILE_RELEASE_CONFIG: ${{ inputs.reconcile-release-config }}
        DEPLOY_IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        log="$RUNNER_TEMP/azure-deploy.log"
        if [[ "$RECONCILE_RELEASE_CONFIG" != "true" && "$RECONCILE_RELEASE_CONFIG" != "false" ]]; then
          echo "Invalid release configuration reconciliation mode." >&2
          exit 1
        fi
        if [[ "$RECONCILE_RELEASE_CONFIG" = "true" && ! "$DEPLOY_IMAGE_TAG" =~ ^[0-9a-f]{12,40}$ ]]; then
          echo "Configuration reconciliation requires a verified release image tag." >&2
          exit 1
        fi
        args=(all ci --image-tag "${DEPLOY_IMAGE_TAG:-$(git rev-parse --short=12 HEAD)}")
        if [ "$RECONCILE_RELEASE_CONFIG" = "true" ]; then
          args+=(--steps bicep,seed-secrets,manifests,rollout)
        fi
        if npm run deploy -- "${args[@]}" > "$log" 2>&1; then
          echo "Azure deployment completed."
        else
          stage="$(sed -n 's/.*Failed: \([a-z-]*\) \([a-z-]*\).*/\1 \2/p' "$log" | tail -1)"
          reason="$(node deploy/scripts/ci-failure-reason.mjs "$log")"
          echo "Azure deployment failed at ${stage:-an unknown stage}. ${reason}" >&2
          exit 1
        fi
    - name: Remove runner configuration
      if: always()
      run: |
        rm -rf deploy/envs/local/ci
        rm -f "$RUNNER_TEMP/azure-deploy.log"
      shell: bash
