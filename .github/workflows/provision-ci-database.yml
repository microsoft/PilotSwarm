name: Provision CI HorizonDB
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ci-provider-database
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    environment: azure-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision dedicated database using shared Azure Bicep
        env:
          AZURE_CI_DATABASE_JSON: ${{ secrets.AZURE_CI_DATABASE_JSON }}
        run: node .github/scripts/azure-ci-database.mjs provision
