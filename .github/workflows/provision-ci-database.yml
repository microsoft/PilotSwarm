name: Provision CI HorizonDB
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ci-provider-database
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    environment: azure-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision dedicated database using shared Azure Bicep
        env:
          AZURE_CI_DATABASE_JSON: ${{ secrets.AZURE_CI_DATABASE_JSON }}
        run: node .github/scripts/azure-ci-database.mjs provision
