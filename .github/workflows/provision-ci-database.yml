name: Provision CI HorizonDB
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-provider-database
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    environment: azure-deploy
    # The Azure runner: a machine in Azure whose managed identity these steps
    # sign in as. See deploy/providers/azure/ci/runner/README.md.
    runs-on: ${{ vars.PROVIDER_TEST_RUNNER }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Azure login as the runner's managed identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          auth-type: IDENTITY
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision dedicated database using shared Azure Bicep
        env:
          AZURE_CI_DATABASE_JSON: ${{ secrets.AZURE_CI_DATABASE_JSON }}
        run: node .github/scripts/azure-ci-database.mjs provision
