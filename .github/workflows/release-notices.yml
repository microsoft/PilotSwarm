name: Add release license notice
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing published version without v; adds LICENSE without replacing assets
        required: true
permissions:
  contents: write
concurrency:
  group: release-license-notices
  cancel-in-progress: false
jobs:
  notices:
    if: github.ref == 'refs/heads/main'
    environment: azure-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Add and verify copyright and permission notice
        run: node .github/scripts/release.mjs notices
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
