name: Add release license notice
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing published version without v; adds LICENSE without replacing assets
        required: true
permissions:
  contents: write
concurrency:
  group: release-license-notices
  cancel-in-progress: false
jobs:
  notices:
    if: github.ref == 'refs/heads/main'
    environment: azure-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - name: Add and verify copyright and permission notice
        run: node .github/scripts/release.mjs notices
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
