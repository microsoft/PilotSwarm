name: Tests
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Baseline filter, or space-separated test/local/*.test.js paths for targeted HDB diagnostics. Blank runs everything.
        required: false
        default: ""
      mode:
        description: Execution mode
        type: choice
        required: false
        default: parallel
        options:
          - parallel
          - sequential
      providers:
        description: Provider coverage (all = baseline + HDB contracts; horizondb = full suite on HDB)
        type: choice
        default: baseline
        options:
          - baseline
          - all
          - horizondb
concurrency:
  group: ci-provider-database
  cancel-in-progress: false
jobs:
  tests:
    name: ${{ inputs.providers == 'horizondb' && inputs.suite != '' && 'Targeted HDB diagnostics (not a release gate)' || inputs.providers != 'baseline' && 'Live HorizonDB coverage' ||
      'Baseline tests' }}
    runs-on: ${{ inputs.providers == 'horizondb' && inputs.suite == '' && vars.PROVIDER_TEST_RUNNER || 'ubuntu-latest' }}
    if: github.ref == 'refs/heads/main'
    environment: azure-deploy
    timeout-minutes: ${{ inputs.providers != 'baseline' && 180 || 59 }}
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durable_copilot
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Azure login with OIDC
        if: inputs.providers != 'baseline'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run provider integration tests
        uses: ./.github/actions/provider-tests
        with:
          providers: ${{ inputs.providers }}
          mode: ${{ inputs.mode }}
          suite: ${{ inputs.suite }}
          hdb-diagnostic: ${{ inputs.providers == 'horizondb' && inputs.suite != '' }}
          postgres-container: ${{ job.services.postgres.id }}
        env:
          CI_TEST_ENV_JSON: ${{ secrets.CI_TEST_ENV_JSON }}
          MODEL_PROVIDERS_JSON: ${{ secrets.MODEL_PROVIDERS_JSON }}
          AZURE_CI_DATABASE_JSON: ${{ secrets.AZURE_CI_DATABASE_JSON }}
