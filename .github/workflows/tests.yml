name: Tests
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional open PR number to test at its pinned head (approval trusts its code with CI credentials). Blank tests main.
        required: false
        default: ""
      suite:
        description: Baseline filter, or space-separated test/local/*.test.js paths for targeted HDB diagnostics. Blank runs everything.
        required: false
        default: ""
      mode:
        description: Execution mode
        type: choice
        required: false
        default: parallel
        options:
          - parallel
          - sequential
      providers:
        description: Provider coverage (all = baseline + HDB contracts; horizondb = full suite on HDB)
        type: choice
        default: baseline
        options:
          - baseline
          - all
          - horizondb
jobs:
  resolve:
    name: Select source for approval
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && contains(github.event.comment.body, '/test all')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # PR conversation comments use the issues endpoint but need PR write access.
      pull-requests: write
      statuses: write
    outputs:
      enabled: ${{ steps.target.outputs.enabled }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      source_sha: ${{ steps.target.outputs.source_sha }}
      source_repository: ${{ steps.target.outputs.source_repository }}
      source_directory: ${{ steps.target.outputs.source_directory }}
      providers: ${{ steps.target.outputs.providers }}
      mode: ${{ steps.target.outputs.mode }}
      suite: ${{ steps.target.outputs.suite }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve and announce the immutable source
        id: target
        run: node .github/scripts/pr-test-target.mjs resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TEST_PROVIDERS: ${{ inputs.providers }}
          TEST_MODE: ${{ inputs.mode }}
          TEST_SUITE: ${{ inputs.suite }}
  tests:
    needs: resolve
    name: ${{ needs.resolve.outputs.pr_number != '' && format('PR {0} at {1} / {2}', needs.resolve.outputs.pr_number, needs.resolve.outputs.source_sha, needs.resolve.outputs.providers) || needs.resolve.outputs.providers == 'horizondb' && needs.resolve.outputs.suite != '' && 'Targeted HDB diagnostics (not a release gate)' || needs.resolve.outputs.providers != 'baseline' && 'Live HorizonDB coverage' ||
      'Baseline tests' }}
    runs-on: ${{ needs.resolve.outputs.pr_number == '' && needs.resolve.outputs.providers == 'horizondb' && needs.resolve.outputs.suite == '' && vars.PROVIDER_TEST_RUNNER || 'ubuntu-latest' }}
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.enabled == 'true'
    # Only authorized test requests reserve the shared database, not ordinary PR comments.
    concurrency:
      group: ci-provider-database
      cancel-in-progress: false
    environment: azure-deploy
    timeout-minutes: ${{ needs.resolve.outputs.providers != 'baseline' && 180 || 59 }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durable_copilot
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout trusted main controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout pinned PR candidate
        if: needs.resolve.outputs.pr_number != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ needs.resolve.outputs.source_directory }}/package-lock.json
      - name: Verify the approved source before using private credentials
        run: node .github/scripts/pr-test-target.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          TEST_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TEST_SOURCE_DIRECTORY: ${{ needs.resolve.outputs.source_directory }}
      - name: Azure login with OIDC
        if: needs.resolve.outputs.providers != 'baseline'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run provider integration tests
        uses: ./.github/actions/provider-tests
        with:
          working-directory: ${{ needs.resolve.outputs.source_directory }}
          source-sha: ${{ needs.resolve.outputs.source_sha }}
          providers: ${{ needs.resolve.outputs.providers }}
          mode: ${{ needs.resolve.outputs.mode }}
          suite: ${{ needs.resolve.outputs.suite }}
          hdb-diagnostic: ${{ needs.resolve.outputs.providers == 'horizondb' && needs.resolve.outputs.suite != '' }}
          qualify-failures: ${{ needs.resolve.outputs.providers != 'baseline' && needs.resolve.outputs.suite == '' }}
          postgres-container: ${{ job.services.postgres.id }}
        env:
          CI_TEST_ENV_JSON: ${{ secrets.CI_TEST_ENV_JSON }}
          MODEL_PROVIDERS_JSON: ${{ secrets.MODEL_PROVIDERS_JSON }}
          AZURE_CI_DATABASE_JSON: ${{ secrets.AZURE_CI_DATABASE_JSON }}
  report:
    name: Report result on the pinned PR commit
    needs: [resolve, tests]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Record the result without executing candidate code
        run: node .github/scripts/pr-test-target.mjs report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          TEST_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TEST_PROVIDERS: ${{ needs.resolve.outputs.providers }}
          TEST_SUITE: ${{ needs.resolve.outputs.suite }}
          TEST_JOB_RESULT: ${{ needs.tests.result }}
