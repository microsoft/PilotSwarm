name: Deploy Azure stamp
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional published release tag to deploy (blank deploys current main)
        required: false
        default: ""
      reconcile_release_config:
        description: Apply current infrastructure/configuration to existing release images without rebuilding or pushing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-deploy
  cancel-in-progress: false
jobs:
  deploy:
    # TEMPORARY: the session-workspaces branch may also deploy the stamp, for
    # a trial before it merges (the azure-deploy environment lists it too).
    # Remove the second clause, and the environment entry, before the merge.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/session-workspaces-test-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: azure-deploy
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select immutable release source when requested
        id: source
        if: inputs.release_tag != '' || inputs.reconcile_release_config
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RECONCILE_RELEASE_CONFIG: ${{ inputs.reconcile_release_config }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A published vX.Y.Z release tag is required." >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != false ]]; then
            echo "The selected release must be published." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "The selected release must belong to main history." >&2
            exit 1
          fi
          if ! image_tag="$(git rev-parse --short=12 "${RELEASE_TAG}^{commit}")"; then
            echo "Cannot resolve the release image tag." >&2
            exit 1
          fi
          echo "image-tag=$image_tag" >> "$GITHUB_OUTPUT"
          if [ "$RECONCILE_RELEASE_CONFIG" = "true" ]; then
            echo "Reconciling current deployment configuration with existing $RELEASE_TAG images."
          else
            git checkout --detach "$RELEASE_TAG"
            echo "Deploying published release $RELEASE_TAG at $(git rev-parse HEAD)"
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy checked-out source
        uses: ./.github/actions/deploy-azure
        with:
          reconcile-release-config: ${{ inputs.reconcile_release_config }}
          image-tag: ${{ steps.source.outputs.image-tag }}
        env:
          AZURE_DEPLOY_ENV: ${{ secrets.AZURE_DEPLOY_ENV }}
          AZURE_FOUNDRY_DEPLOYMENTS_JSON: ${{ secrets.AZURE_FOUNDRY_DEPLOYMENTS_JSON }}
          AZURE_MODEL_PROVIDERS_JSON: ${{ secrets.AZURE_MODEL_PROVIDERS_JSON }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_DEPLOY_PRINCIPAL_OBJECT_ID: ${{ secrets.AZURE_DEPLOY_PRINCIPAL_OBJECT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
