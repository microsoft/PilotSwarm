name: "Copilot Code Review Setup"

on:
    workflow_dispatch:

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install public model catalog
              run: cp .model_providers.example.json .model_providers.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
