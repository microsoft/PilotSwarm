name: "Copilot Code Review Setup"

on:
    workflow_dispatch:

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "24.22.1"
                  cache: "npm"

            - name: Install public model catalog
              run: cp .model_providers.example.json .model_providers.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
