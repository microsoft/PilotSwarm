name: PR checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-azure-linux:
    name: Duroxide native runtime (Azure Linux 3)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/onebranch/azurelinux/build:3.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Verify the native compatibility baseline
        run: |
          node --eval "
            const assert = require('node:assert/strict');
            assert.equal(process.versions.node, '24.22.1');
            assert.equal(process.report.getReport().header.glibcVersionRuntime, '2.38');
          "
      - run: npm ci
      - name: Verify exact native artifacts and runtime restart
        run: node --test packages/sdk/test/unit/duroxide-dependency.test.mjs

  workflow-scripts-node26:
    name: Workflow scripts (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Workflow script tests on Node 26's permission model
        run: |
          node --test packages/sdk/test/unit/workflow-script-guard.test.mjs \
            packages/sdk/test/unit/workflow-node-guardrails.test.mjs \
            packages/sdk/test/unit/workflow-script-tool-result-limit.test.mjs

  sdk-unit-windows:
    name: Repository build and SDK unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install public model catalog for unit tests
        shell: pwsh
        run: Copy-Item .model_providers.example.json .model_providers.json
      - shell: bash
        run: npm run test:unit --workspace=pilotswarm-sdk
      - name: Validation campaign unit tests
        run: |
          npm run test:campaign:unit
          npm run test:campaign:dashboard:unit

  basic:
    name: Repository policy, build, and unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Check repository privacy
        run: node scripts/check-repository-privacy.mjs
      - run: npm ci
      - run: npm run build
      - name: Deployment and CI policy tests
        run: |
          npm run test:deploy-scripts
          node --test .github/scripts/test/*.test.mjs .github/scripts/integration/*.test.mjs
      - name: Install public model catalog for unit tests
        run: cp .model_providers.example.json .model_providers.json
      - name: SDK API and unit tests
        run: |
          npm run test:api --workspace=pilotswarm-sdk
          npm run test:unit --workspace=pilotswarm-sdk
      - name: Validation campaign unit tests
        run: |
          npm run test:campaign:unit
          npm run test:campaign:dashboard:unit
      - name: Application unit tests
        run: npm test --workspace=pilotswarm
