name: Create dev release
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to snapshot; blank uses the captured main commit. Version is allocated as 0.0.0-dev.N.
        required: false
        default: ""
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-dev
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    name: Select source for approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - name: Pin the selected source before approval
        id: source
        run: node .github/scripts/release-source.mjs resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RELEASE: "true"
          SOURCE_BRANCH: ${{ inputs.source_branch }}
  release:
    needs: resolve
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-common.yml
    with:
      development: true
      source_sha: ${{ needs.resolve.outputs.source_sha }}
    secrets: inherit
