name: Create dev release
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Optional source branch; dispatch from main. Blank snapshots captured main. Version is allocated as 0.0.0-dev.N.
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: release-dev
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    name: Select source for approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_pr: ${{ steps.source.outputs.source_pr }}
      source_branch: ${{ steps.source.outputs.source_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Pin the selected source before approval
        id: source
        run: node .github/scripts/release-source.mjs resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RELEASE: "true"
          SOURCE_BRANCH: ${{ inputs.source_branch }}
  release:
    needs: resolve
    uses: ./.github/workflows/release-common.yml
    with:
      development: true
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      source_pr: ${{ needs.resolve.outputs.source_pr }}
      source_branch: ${{ needs.resolve.outputs.source_branch }}
    secrets: inherit
