name: Create release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared stable package version on main (X.Y.Z, without v)
        required: true
        default: 0.6.0
permissions:
  contents: write
  id-token: write
concurrency:
  group: azure-deploy
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-common.yml
    with:
      development: false
      version: ${{ inputs.version }}
    secrets: inherit
