apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Session workspaces on the portal side. The portal lists and starts only
# agents it loads itself, so it loads the sample's repo-coder agent too. The
# deploy tool adds this component to the staged portal overlay when
# WORKSPACES_ENABLED=true (deploy/scripts/lib/workspaces.mjs).

patches:
  - path: portal-patch.yaml
