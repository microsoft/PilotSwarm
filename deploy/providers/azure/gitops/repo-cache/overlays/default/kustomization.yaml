apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default repo-cache overlay. The repo pod runs in the worker's namespace, so
# the NetworkPolicy can name worker pods with a plain pod selector.
namespace: pilotswarm

resources:
  - ../../base

# Built from the rendered `.env`; it carries only IMAGE, for the replacements
# below. The hash suffix stays on: a new image renames the ConfigMap, and the
# Deployment changes with it.
configMapGenerator:
  - name: repo-cache-env
    envs:
      - .env

replacements:
  - source:
      kind: ConfigMap
      name: repo-cache-env
      fieldPath: data.IMAGE
    targets:
      - select:
          kind: Deployment
          name: repo-cache
        fieldPaths:
          - spec.template.spec.initContainers.[name=layout].image
          - spec.template.spec.containers.[name=repo-service].image
          - spec.template.spec.containers.[name=nfs].image
