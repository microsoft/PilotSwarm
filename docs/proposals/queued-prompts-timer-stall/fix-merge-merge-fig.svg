<svg viewBox="0 0 720 192" width="720" height="192" role="img" aria-label="R1: the issue's FIFO and one wake. T is the stuck timer item. U is the owner's prompt." xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="i192-m-merge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6f6a62"/></marker></defs><rect x="0" y="0" width="720" height="192" fill="#fbfaf7"/><text x="124" y="18" fill="#6f6a62">queued (FIFO), oldest first</text><text x="380" y="18" fill="#6f6a62">one turn</text><text x="508" y="18" fill="#6f6a62">left in the FIFO</text><text x="16" y="50" font-size="13" fill="#1c1b19" font-weight="700">Today</text><rect x="124" y="30" width="40" height="30" rx="3" fill="#f8ead9" stroke="#b8601a" stroke-width="1.2"/><text x="144.0" y="49.5" font-size="12.5" fill="#1c1b19" text-anchor="middle" font-weight="600">T</text><rect x="169" y="30" width="40" height="30" rx="3" fill="#e6eef7" stroke="#2f5d8a" stroke-width="1.2"/><text x="189.0" y="49.5" font-size="12.5" fill="#1c1b19" text-anchor="middle" font-weight="600">P1</text><rect x="214" y="30" width="40" height="30" rx="3" fill="#e6eef7" stroke="#2f5d8a" stroke-width="1.2"/><text x="234.0" y="49.5" font-size="12.5" fill="#1c1b19" text-anchor="middle" font-weight="600">P2</text><rect x="259" y="30" width="40" height="30" rx="3" fill="#e6eef7" stroke="#2f5d8a" stroke-width="1.2"/><text x="279.0" y="49.5" font-size="12.5" fill="#1c1b19" text-anchor="middle" font-weight="600">P3</text><rect x="304" y="30" width="40" height="30" rx="3" fill="#e6eef7" stroke="#2f5d8a" stroke-width="1.2"/><text x="324.0" y="49.5" font-size="12.5" fill="#1c1b19" text-anchor="middle" font-weight="600">U</text><path d="M350 45 L374 45" stroke="#6f6a62" stroke-width="1.6" fill="none" marker-end="url(#i192-m-merge)"/><rect x="380" y="30" width="92" height="3