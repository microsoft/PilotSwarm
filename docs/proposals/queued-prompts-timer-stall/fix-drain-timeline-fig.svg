<svg viewBox="0 0 720 246" width="720" height="246" role="img" aria-label="The issue's coordinator after a turn. The cron has 2,490 s left. P2, P3 and U are queued." xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="i192-m-time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6f6a62"/></marker></defs><rect x="0" y="0" width="720" height="246" fill="#fbfaf7"/><text x="16" y="20" font-size="13" fill="#1c1b19" font-weight="700">Today</text><path d="M16 74 L704 74" stroke="#6f6a62" stroke-width="1.6" fill="none" marker-end="url(#i192-m-time)"/><path d="M24 66 L24 82" stroke="#6f6a62" stroke-width="1.2" fill="none"/><text x="24" y="96" fill="#6f6a62">turn ends</text><rect x="32" y="40" width="470" height="24" rx="3" fill="#efece6" stroke="#c9c2b6" stroke-width="1.2"/><text x="267" y="56" fill="#3d3a35" text-anchor="middle">drain waits on the cron: up to 2,490 s</text><path d="M512 66 L512 82" stroke="#6f6a62" stroke-width="1.2" fill="none"/><text x="512" y="96" fill="#6f6a62" text-anchor="middle">a message arrives</text><rect x="520" y="40" width="120" height="24" rx="3" fill="#e1f1e7" stroke="#2d7a4f" stroke-width="1.2"/><text x="580.0" y="56.5" fill="#1c1b19" text-anchor="middle" font-weight="600">turn: P2 only</text><text x="32" y="116" fill="#b03a2e">P3 and U wait for the next outside wake. Each wake runs one prompt.</text><path d="M16 132 L704 132" stroke="#c9c2b6" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/><text x="16" y="152" font-size="13" fill="#1c1b19" font-weight="700">With the fix</text><path d="M16 214 L704 214" stroke="#6f6a62" stroke-width="1.6" fill="none" marker-end="url(#i192-m-time)"/><path d="M24 206 L24 222" stroke="#6f6a62" stroke-width="1.2" fill="none"/><text x="24" y="236" fill="#6f6a62">turn ends</text><text x="32" y="174" fill="#2d7a4f">save the cron's 2,490 s</text><rect x="32" y="180" width="60" height="24" rx="3" fill="#efece6" stroke="#c9c2b6" stroke-width="1.2"/><text x="62" y="196" fill="#3d3a35" text-anchor="middle">10 ms</text><rect x="98" y="180" width="196" height="24" rx="3" fill="#e1f1e7" stroke="#2d7a4f" stroke-width="1.2"/><text x="196.0" y="196.5" fill="#1c1b19" text-anchor="middle" font-weight="600">turn: P2 · P3 · U</text><path d="M300 192 L690 192" stroke="#2d7a4f" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/><text x="306" y="174" fill="#2d7a4f">cron re-armed with the saved 2,490 s</text><path d="M690 184 L690 200" stroke="#2d7a4f" stroke-width="2" fill="none"/><text x="704" y="236" fill="#6f6a62" text-anchor="end">cron fires</text></svg>
