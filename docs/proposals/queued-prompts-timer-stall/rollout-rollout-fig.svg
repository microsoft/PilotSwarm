<svg viewBox="0 0 720 186" width="720" height="186" role="img" aria-label="A live 1.0.81 session moves to the new version at its next continue-as-new." xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="i192-m-roll" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6f6a62"/></marker></defs><rect x="0" y="0" width="720" height="186" fill="#fbfaf7"/><rect x="16" y="24" width="280" height="46" rx="4" fill="#f3f1ec" stroke="#8a8378" stroke-width="1.2"/><text x="28" y="43" font-size="12.5" fill="#1c1b19" font-weight="700">execution k · orchestration 1.0.81</text><text x="28" y="61" fill="#3d3a35">replays on frozen orchestration_1_0_81/</text><path d="M302 47 L410 47" stroke="#6f6a62" stroke-width="1.6" fill="none" marker-end="url(#i192-m-roll)"/><text x="356" y="38" fill="#6f6a62" text-anchor="middle">continue-as-new</text><rect x="416" y="24" width="288" height="46" rx="4" fill="#e1f1e7" stroke="#2d7a4f" stroke-width="1.2"/><text x="428" y="43" font-size="12.5" fill="#1c1b19" font-weight="700">execution k+1 · orchestration 1.0.82</text><text x="428" y="61" fill="#3d3a35">the KV FIFO carries over unchanged</text><text x="16" y="92" fill="#6f6a62">The FIFO keeps its stuck state until then.</text><text x="416" y="92" fill="#3d3a35">It drains what it inherits:</text><text x="416" y="110" fill="#2d7a4f">[T, T, P1, P2] → turn P1 · P2, then one cron turn.</text><path d="M16 124 L704 124" stroke="#c9c2b6" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/><text x="16" y="144" fill="#3d3a35">Continue-as-new comes after at most 10 loop passes, or when the session has no work and no timer.</text><text x="16" y="162" fill="#3d3a35">New sessions start on 1.0.82.</text><text x="16" y="180" fill="#b03a2e">Prompts dropped before the upgrade are gone: send them again.</text></svg>
