<svg viewBox="0 0 720 166" width="720" height="166" role="img" aria-label="R4 with numbers: a cron keeps its remaining time, the same rule a new message follows today." xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="i192-m-cron" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6f6a62"/></marker></defs><rect x="0" y="0" width="720" height="166" fill="#fbfaf7"/><path d="M40 82 L704 82" stroke="#6f6a62" stroke-width="1.6" fill="none" marker-end="url(#i192-m-cron)"/><path d="M40.0 72 L40.0 92" stroke="#1c1b19" stroke-width="1.6" fill="none"/><text x="40.0" y="60" fill="#3d3a35">cron armed: 3,600 s</text><path d="M232.0 72 L232.0 92" stroke="#1c1b19" stroke-width="1.6" fill="none"/><rect x="232.0" y="74" width="10.400000000000006" height="16" rx="1" fill="#e1f1e7" stroke="#2d7a4f" stroke-width="1.2"/><text x="237.2" y="60" fill="#2d7a4f" text-anchor="middle">turn, 60 s</text><text x="232.0" y="108" fill="#3d3a35" text-anchor="middle">queued work found:</text><text x="232.0" y="124" fill="#3d3a35" text-anchor="middle">2,490 s left, saved</text><text x="246.4" y="142" fill="#2d7a4f">re-armed: 2,490 s</text><path d="M662.7 66 L662.7 92" stroke="#6f6a62" stroke-width="1.4" fill="none" stroke-dasharray="3 3"/><text x="658.7" y="60" fill="#6f6a62" text-anchor="end">first planned fire: 3,600 s</text><path d="M673.1 72 L673.1 92" stroke="#2d7a4f" stroke-width="2" fill="none"/><text x="704" y="108" fill="#2d7a4f" text-anchor="end">fires: 3,660 s</text><text x="40" y="24" font-size="12.5" fill="#1c1b19" font-weight="600">A 3,600 s cron. Queued work runs at 1,110 s.</text><text x="40" y="160" fill="#6f6a62">The fire moves by the turn's length, 60 s here. A message interrupt does the same today.</text></svg>
