<svg viewBox="0 0 720 530" width="720" height="530" role="img" aria-label="drain's checks, top to bottom. The first check that matches decides what drain does on that pass." xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12"><rect x="0" y="0" width="720" height="530" fill="#fbfaf7"/><text x="16" y="20" font-size="13" fill="#1c1b19" font-weight="700">Today: drain's checks, in order</text><text x="368" y="20" font-size="13" fill="#1c1b19" font-weight="700">With the fix</text><rect x="16" y="34" width="336" height="52" rx="4" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.2"/><circle cx="31" cy="50" r="9" fill="#6f6a62"/><text x="31" y="54" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="48" y="54" fill="#3d3a35">Legacy message waiting:</text><text x="48" y="69" fill="#3d3a35">use it.</text><rect x="16" y="92" width="336" height="52" rx="4" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.2"/><circle cx="31" cy="108" r="9" fill="#6f6a62"/><text x="31" y="112" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="48" y="112" fill="#3d3a35">Regeneration pending:</text><text x="48" y="127" fill="#3d3a35">10 ms sweep.</text><rect x="16" y="150" width="336" height="52" rx="4" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.2"/><circle cx="31" cy="166" r="9" fill="#6f6a62"/><text x="31" y="170" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="48" y="170" fill="#3d3a35">Carried steers waiting:</text><text x="48" y="185" fill="#3d3a35">wake the session.</text><rect x="16" y="208" width="336" height="67" rx="4" fill="#fbefec" stroke="#b03a2e" stroke-width="1.8"/><circle cx="31" cy="224" r="9" fill="#b03a2e"/><text x="31" y="228" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="48" y="228" fill="#3d3a35">Timer armed or digest window open:</text><text x="48" y="243" fill="#3d3a35">wait for a message or the timer.</text><text x="48" y="258" fill="#b03a2e">Queued work waits here.</text><rect x="16" y="281" width="336" height="67" rx="4" fill="#fbefec" stroke="#b03a2e" stroke-width="1.8"/><circle cx="31" cy="297" r="9" fill="#b03a2e"/><text x="31" y="301" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="48" y="301" fill="#3d3a35">FIFO empty: block on the first pass,</text><text x="48" y="316" fill="#3d3a35">stop on a later pass.</text><text x="48" y="331" fill="#b03a2e">More waiting messages miss this turn.</text><rect x="16" y="354" width="336" height="37" rx="4" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.2"/><circle cx="31" cy="370" r="9" fill="#6f6a62"/><text x="31" y="374" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="48" y="374" fill="#3d3a35">Otherwise: 10 ms sweep, then decide.</text><rect x="368" y="34" width="336" height="52" rx="4" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.2"/><circle cx="383" cy="50" r="9" fill="#6f6a62"/><text x="383" y="54" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="400" y="54" fill="#3d3a35">Legacy message waiting:</text><text x="400" y="69" fill="#3d3a35">use it.</text><rect x="368" y="92" width="336" height="52" rx="4" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.2"/><circle cx="383" cy="108" r="9" fill="#6f6a62"/><text x="383" y="112" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="400" y="112" fill="#3d3a35">Regeneration pending:</text><text x="400" y="127" fill="#3d3a35">10 ms sweep.</text><rect x="368" y="150" width="336" height="52" rx="4" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.2"/><circle cx="383" cy="166" r="9" fill="#6f6a62"/><text x="383" y="170" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="400" y="170" fill="#3d3a35">Carried steers waiting:</text><text x="400" y="185" fill="#3d3a35">wake the session.</text><rect x="368" y="208" width="336" height="82" rx="4" fill="#edf6f0" stroke="#2d7a4f" stroke-width="1.8"/><circle cx="383" cy="224" r="9" fill="#2d7a4f"/><text x="383" y="228" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="400" y="228" fill="#3d3a35">New: a prompt or answer is queued, under</text><text x="400" y="243" fill="#3d3a35">any timer; or a timer item, under idle,</text><text x="400" y="258" fill="#3d3a35">cron, cron_at or a plain wait: handle the</text><text x="400" y="273" fill="#3d3a35">timer as a new message does, 10 ms sweep.</text><rect x="368" y="296" width="336" height="67" rx="4" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.2"/><circle cx="383" cy="312" r="9" fill="#6f6a62"/><text x="383" y="316" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="400" y="316" fill="#3d3a35">Timer armed or digest window open: wait.</text><text x="400" y="331" fill="#3d3a35">Now only when no prompt or answer</text><text x="400" y="346" fill="#3d3a35">is queued.</text><rect x="368" y="369" width="336" height="52" rx="4" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.2"/><circle cx="383" cy="385" r="9" fill="#6f6a62"/><text x="383" y="389" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="400" y="389" fill="#3d3a35">FIFO empty and nothing collected: block on</text><text x="400" y="404" fill="#3d3a35">the first pass, stop on a later one.</text><rect x="368" y="427" width="336" height="67" rx="4" fill="#edf6f0" stroke="#2d7a4f" stroke-width="1.8"/><circle cx="383" cy="443" r="9" fill="#2d7a4f"/><text x="383" y="447" fill="#ffffff" text-anchor="middle" font-weight="700">7</text><text x="400" y="447" fill="#3d3a35">Changed: otherwise, now also after a</text><text x="400" y="462" fill="#3d3a35">message was collected: 10 ms sweep</text><text x="400" y="477" fill="#3d3a35">until the queue is empty.</text><rect x="16" y="508" width="12" height="12" rx="2" fill="#fbefec" stroke="#b03a2e" stroke-width="1.8"/><text x="34" y="518" fill="#3d3a35">where queued work waits today</text><rect x="260" y="508" width="12" height="12" rx="2" fill="#edf6f0" stroke="#2d7a4f" stroke-width="1.8"/><text x="278" y="518" fill="#3d3a35">new or changed check (R3, R10)</text></svg>
