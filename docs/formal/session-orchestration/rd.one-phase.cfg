\* rd.one-phase (latest-1083; expected safety): Release-note warning: a rolling deploy that flips latest per worker: an old worker fetches the 1.0.83 item, abandons it with backoff and poisons it past the attempt limit (10 in duroxide, about 5 minutes).
SPECIFICATION Spec
CONSTANTS
    Strategy = "one-phase"
    TagEverywhere = TRUE
    MaxAttempts = 2
    Fault = "none"
INVARIANTS
    Inv_NoPoison
CHECK_DEADLOCK FALSE
