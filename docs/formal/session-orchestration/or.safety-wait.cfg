\* or.safety-wait (so3; expected PASS): Owned retry with an armed wait, lossy hand-off and graceful shutdown allowed.
SPECIFICATION Spec
CONSTANTS
    TimerKind = "wait"
    AllowHandoff = TRUE
    AllowShutdown = TRUE
    Mode = "1.0.83"
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_RetryFirst
    Inv_KeyOnlyForRetry
    Inv_FreshNoKey
    Inv_RetryNotLost
    Inv_AgentWaitKept
CHECK_DEADLOCK TRUE
