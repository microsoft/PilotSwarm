    P = 2
    FifoCap = 1
    AllowCancel = TRUE
    AllowLateCancel = TRUE
    LateGiveBack = FALSE
    AllowTooLarge = TRUE
    AllowCompact = TRUE
    AllowHydFail = FALSE
    Intake = TRUE
    Rearm = TRUE
    Fault = "none"
INVARIANTS
    Inv_NoticeAccounted
CHECK_DEADLOCK FALSE
