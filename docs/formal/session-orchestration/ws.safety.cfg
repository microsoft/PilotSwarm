\* ws.safety (ws2; expected PASS): One deadline, a hang, steps started late and overlapping, a committed and a legacy session; the local folder survives exit.
SPECIFICATION Spec
CONSTANTS
    HasDeadline = TRUE
    LocalSurvivesExit = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_CommittedRecoverable
    Inv_DeleteOnlyMarked
    Inv_LegacyRecoverable
CHECK_DEADLOCK TRUE
