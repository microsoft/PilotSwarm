\* rn.live-hydfail (so2; expected PASS): As rn.live with a given-up hydration (the session ends in error).
SPECIFICATION LiveSpec
CONSTANTS
    P = 2
    FifoCap = 1
    AllowCancel = TRUE
    AllowLateCancel = FALSE
    LateGiveBack = FALSE
    AllowTooLarge = TRUE
    AllowCompact = TRUE
    AllowHydFail = TRUE
    Intake = TRUE
    Rearm = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_NoticeAccounted
    Inv_DeliveredAtMostOnce
    Inv_SrTimerResumes
    Inv_NoSendWhileHydrating
    Inv_HydrationWaitRecorded
PROPERTIES
    Prop_NoticeDelivered
    Prop_IntakeSettles
CHECK_DEADLOCK TRUE
