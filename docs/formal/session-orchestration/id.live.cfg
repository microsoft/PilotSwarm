\* id.live (so3; expected PASS): A due write is made and a pending arrival starts its turn.
SPECIFICATION LiveSpec
CONSTANTS
    Cap = 2
    Latest83 = TRUE
    Mode = "1.0.83"
    MaxCan = 2
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_NoCanWhileDue
    Inv_OneCallPerWake
    Inv_ArrivalKept
    Inv_HistoryBounded
    Inv_NoDowngrade
    Inv_RoutedToIntakeWorker
    Inv_NoExecutionFailure
PROPERTIES
    Prop_WriteMade
    Prop_ArrivalTurns
CHECK_DEADLOCK TRUE
