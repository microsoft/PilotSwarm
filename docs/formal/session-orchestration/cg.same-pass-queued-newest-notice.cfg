\* cg.same-pass-queued-newest-notice (so5b; expected safety): Known limit (accepted): when an older queued prompt carries a rehydration notice, the pass's newer notice is kept back; the older notice is already embedded in that queued prompt's text, so the model is told once and nothing is lost.
SPECIFICATION Spec
CONSTANTS
    Fix = TRUE
    AllowBig = FALSE
    MaxUpd = 2
    MaxGen = 2
    MaxPrompts = 3
    Fault = "none"
    SweepCan = "none"
    Chrono = "observed"
    SkipQueued = "rank"
    AllowPassCancel = TRUE
    PassSkip = "rank"
INVARIANTS
    Inv_NewestNoticeKept
CHECK_DEADLOCK FALSE
