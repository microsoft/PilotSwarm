\* rd.recreate (latest-1083; expected PASS): The release's deploy: every worker stopped, upgraded and started; new workers register 1.0.83, the turns and the tag before any session reaches 1.0.83: no abandon, no poison, the turn runs.
SPECIFICATION LiveSpec
CONSTANTS
    Strategy = "recreate"
    TagEverywhere = TRUE
    MaxAttempts = 2
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_NoPoison
    Inv_NoAbandon
PROPERTIES
    Prop_TurnRuns
CHECK_DEADLOCK TRUE
