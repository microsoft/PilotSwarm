    MaxTries = 3
    MaxDropFail = 2
    AllowUnsettled = TRUE
    Mode = "no-drop"
    Fault = "none"
INVARIANTS
    Inv_NoCommitWhileWarm
CHECK_DEADLOCK FALSE
