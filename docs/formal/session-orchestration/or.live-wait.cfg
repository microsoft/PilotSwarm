\* or.live-wait (so3; expected PASS): The owed retry is dispatched and a released wait is re-armed or fires.
SPECIFICATION LiveSpec
CONSTANTS
    TimerKind = "wait"
    AllowHandoff = TRUE
    AllowShutdown = FALSE
    Mode = "1.0.83"
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_RetryFirst
    Inv_KeyOnlyForRetry
    Inv_FreshNoKey
    Inv_RetryNotLost
    Inv_AgentWaitKept
PROPERTIES
    Prop_RetryDispatched
    Prop_WaitResumes
CHECK_DEADLOCK TRUE
