\* sw.live (so2; expected PASS): With at most two failed drops and three attempts, the turn is committed.
SPECIFICATION LiveSpec
CONSTANTS
    MaxTries = 3
    MaxDropFail = 2
    AllowUnsettled = TRUE
    Mode = "rt-f1"
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_NoCommitWhileWarm
    Inv_FailedAttemptSavesNothing
    Inv_NoWriteAfterCommit
PROPERTIES
    Prop_TurnCommits
CHECK_DEADLOCK TRUE
