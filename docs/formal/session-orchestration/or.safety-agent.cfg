\* or.safety-agent (so3; expected PASS): As or.safety-wait with an agent wait: kept, its poll queued after the retry.
SPECIFICATION Spec
CONSTANTS
    TimerKind = "agent"
    AllowHandoff = TRUE
    AllowShutdown = TRUE
    Mode = "1.0.83"
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_RetryFirst
    Inv_KeyOnlyForRetry
    Inv_FreshNoKey
    Inv_RetryNotLost
    Inv_AgentWaitKept
CHECK_DEADLOCK TRUE
