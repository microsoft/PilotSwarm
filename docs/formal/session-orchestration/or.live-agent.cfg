\* or.live-agent (so3; expected PASS): As or.live-wait with an agent wait.
SPECIFICATION LiveSpec
CONSTANTS
    TimerKind = "agent"
    AllowHandoff = TRUE
    AllowShutdown = FALSE
    Mode = "1.0.83"
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_RetryFirst
    Inv_KeyOnlyForRetry
    Inv_FreshNoKey
    Inv_RetryNotLost
    Inv_AgentWaitKept
PROPERTIES
    Prop_RetryDispatched
CHECK_DEADLOCK TRUE
