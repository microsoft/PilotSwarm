\* rn.live (so2; expected PASS): The notice reaches the model and the owed intake is sent, assuming a later rehydrating wait (Rearm).
SPECIFICATION LiveSpec
CONSTANTS
    P = 2
    FifoCap = 1
    AllowCancel = TRUE
    AllowLateCancel = FALSE
    LateGiveBack = FALSE
    AllowTooLarge = TRUE
    AllowCompact = TRUE
    AllowHydFail = FALSE
    Intake = TRUE
    Rearm = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_NoticeAccounted
    Inv_DeliveredAtMostOnce
    Inv_SrTimerResumes
    Inv_NoSendWhileHydrating
    Inv_HydrationWaitRecorded
PROPERTIES
    Prop_NoticeDelivered
    Prop_IntakeSettles
CHECK_DEADLOCK TRUE
