\* fault.or-fresh-with-key (so3; expected safety): A lossy hand-off's fresh retry reuses the thrown key.
SPECIFICATION Spec
CONSTANTS
    TimerKind = "wait"
    AllowHandoff = TRUE
    AllowShutdown = TRUE
    Mode = "1.0.83"
    Fault = "fresh-with-key"
INVARIANTS
    Inv_FreshNoKey
CHECK_DEADLOCK FALSE
