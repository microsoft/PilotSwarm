\* cmp.par2-paused-cancel-resume (comparison; expected liveness): The rejected resume rule, without J1's cut in the timeout transaction: hung work runs while the run stays paused.
SPECIFICATION LiveSpec
CONSTANTS
    N = 3
    K = 2
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {2}
    CanFail = {1, 2, 3}
    Hang = {2, 3}
    AllowSkew = FALSE
    AllowPause = TRUE
    PausedCancel = "resume"
    ResumeFair = FALSE
    AllowRunEnd = FALSE
    AllowEndFail = FALSE
    MaxCrash = 0
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "decided"
    TimeoutCounts = "work"
    JoinCheck = "work"
    StoreCutsOnTimeout = FALSE
    EndFailRetries = TRUE
    MaxEndFail = 1
    PauseSeen = "collect"
    EndBudget = "forced"
    EndForever = FALSE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
PROPERTIES
    Prop_CancelledStops
CHECK_DEADLOCK TRUE
