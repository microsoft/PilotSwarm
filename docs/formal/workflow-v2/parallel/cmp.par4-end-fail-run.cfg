    N = 3
    K = 1
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {1, 2, 3}
    CanFail = {1, 2, 3}
    Hang = {3}
    AllowSkew = FALSE
    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = TRUE
    AllowEndFail = TRUE
    MaxCrash = 0
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "decided"
    TimeoutCounts = "work"
    JoinCheck = "work"
    StoreCutsOnTimeout = TRUE
    EndFailRetries = TRUE
    MaxEndFail = 1
    PauseSeen = "collect"
    EndBudget = "fail-run"
    EndForever = TRUE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
PROPERTIES
    Prop_JoinRouted
CHECK_DEADLOCK TRUE
