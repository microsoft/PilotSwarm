\* par.hang-timer-live (reviewed; expected PASS): Two hung branches: only the timer decides, and the hung work stops.
SPECIFICATION LiveSpec
CONSTANTS
    N = 3
    K = 2
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {2}
    CanFail = {1, 2, 3}
    Hang = {2, 3}
    AllowSkew = FALSE
    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = TRUE
    AllowEndFail = TRUE
    MaxCrash = 0
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "p1"
    TimeoutCounts = "work"
    JoinCheck = "none"
    StoreCutsOnTimeout = FALSE
    EndFailRetries = FALSE
    MaxEndFail = 0
    PauseSeen = "collect"
    EndBudget = "forced"
    EndForever = FALSE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_OneDecision
    Inv_JoinedNeedsK
    Inv_WinnersFirstK
    Inv_BlockedOnlyWhenImpossible
    Inv_FailFastFalseWaits
    Inv_ReportKeepsFinished
    Inv_NoStartAfterDecision
    Inv_NoRouteAfterDecision
    Inv_QueuedNeverStarted
    Inv_Concurrency
    Inv_RoutedOnce
    Inv_NoEarlyTimeout
    Inv_DroppedBranchDecided
    Inv_CancelAckedMeansAsked
PROPERTIES
    Prop_Decided
    Prop_Routed
    Prop_CancelledStops
    Prop_BranchesSettle
CHECK_DEADLOCK TRUE
