\* wit.par-timeout-while-paused (witness; expected safety): Design limit: the timer runs while paused and decides, while no join can.
SPECIFICATION Spec
CONSTANTS
    N = 2
    K = 1
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {2}
    CanFail = {1, 2}
    Hang = {}
    AllowSkew = TRUE
    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = TRUE
    AllowEndFail = TRUE
    MaxCrash = 1
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "p1"
    TimeoutCounts = "work"
    JoinCheck = "none"
    StoreCutsOnTimeout = FALSE
    EndFailRetries = FALSE
    MaxEndFail = 0
    PauseSeen = "collect"
    EndBudget = "forced"
    EndForever = FALSE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    W_NotTimedOutWhilePaused
CHECK_DEADLOCK TRUE
