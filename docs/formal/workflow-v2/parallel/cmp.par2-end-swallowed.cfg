    N = 3
    K = 1
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {1, 2, 3}
    CanFail = {1, 2, 3}
    Hang = {}
    AllowSkew = TRUE
    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = TRUE
    AllowEndFail = TRUE
    MaxCrash = 1
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "decided"
    TimeoutCounts = "work"
    JoinCheck = "work"
    StoreCutsOnTimeout = TRUE
    EndFailRetries = FALSE
    MaxEndFail = 0
    PauseSeen = "collect"
    EndBudget = "forced"
    EndForever = FALSE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
