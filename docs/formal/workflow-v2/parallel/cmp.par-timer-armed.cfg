    K = 1
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {2}
    CanFail = {1, 2}
    Hang = {}
    AllowSkew = TRUE
    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = TRUE
    AllowEndFail = TRUE
    MaxCrash = 1
