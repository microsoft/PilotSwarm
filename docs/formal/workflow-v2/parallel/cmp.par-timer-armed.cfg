    MaxEndFail = 0
    PauseSeen = "collect"
    EndBudget = "forced"
    EndForever = FALSE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
    Fault = "timer-armed"
INVARIANTS
    TypeOK
    Inv_OneDecision
    Inv_JoinedNeedsK
    Inv_WinnersFirstK
    Inv_BlockedOnlyWhenImpossible
    Inv_FailFastFalseWaits
