\* cmp.par-paused-cancel-resume (comparison; expected liveness): Rule choice: a timeout while paused that cancels only at the resume leaves hung work running while the run stays paused.
SPECIFICATION LiveSpec
CONSTANTS
    N = 3
    K = 2
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {2}
    CanFail = {1, 2, 3}
    Hang = {2, 3}
    AllowSkew = FALSE
    AllowPause = TRUE
    PausedCancel = "resume"
    ResumeFair = FALSE
    AllowRunEnd = FALSE
    AllowEndFail = FALSE
    MaxCrash = 0
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "p1"
    TimeoutCounts = "work"
    JoinCheck = "none"
    StoreCutsOnTimeout = FALSE
    EndFailRetries = FALSE
    MaxEndFail = 0
    PauseSeen = "collect"
    EndBudget = "forced"
    EndForever = FALSE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
PROPERTIES
    Prop_CancelledStops
CHECK_DEADLOCK TRUE
