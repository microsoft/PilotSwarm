    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = TRUE
    AllowEndFail = TRUE
    MaxCrash = 1
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "decided"
    TimeoutCounts = "work"
    Fault = "none"
INVARIANTS
    TypeOK
    W_NoLateJoin
CHECK_DEADLOCK TRUE
