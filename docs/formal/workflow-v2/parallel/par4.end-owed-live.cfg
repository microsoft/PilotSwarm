\* par4.end-owed-live (reviewed; expected PASS): J1d, ends that keep failing: the decided join is routed, a queued cancel is taken, and the run's end ends every owed child.
SPECIFICATION LiveSpec
CONSTANTS
    N = 3
    K = 1
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {1, 2, 3}
    CanFail = {1, 2, 3}
    Hang = {3}
    AllowSkew = FALSE
    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = TRUE
    AllowEndFail = TRUE
    MaxCrash = 0
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "decided"
    TimeoutCounts = "work"
    JoinCheck = "work"
    StoreCutsOnTimeout = TRUE
    EndFailRetries = TRUE
    MaxEndFail = 0
    PauseSeen = "collect"
    EndBudget = "owe"
    EndForever = TRUE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_OneDecision
    Inv_JoinedNeedsK
    Inv_WinnersFirstK
    Inv_BlockedOnlyWhenImpossible
    Inv_FailFastFalseWaits
    Inv_ReportKeepsFinished
    Inv_NoStartAfterDecision
    Inv_NoRouteAfterDecision
    Inv_QueuedNeverStarted
    Inv_Concurrency
    Inv_RoutedOnce
    Inv_NoEarlyTimeout
    Inv_DroppedBranchDecided
    Inv_CancelAckedMeansAsked
    Inv_FinishedWorkWins
    Inv_BlockedStaysBlocked
    Inv_NoLateJoin
    Inv_WinnersCommitOrder
    Inv_LoserEndedBeforeRoute
    Inv_WinnersNeverCut
    Inv_NoRouteWhilePaused
PROPERTIES
    Prop_Decided
    Prop_Routed
    Prop_CancelledStops
    Prop_BranchesSettle
    Prop_JoinRouted
    Prop_OwedEnded
    Prop_CommandTaken
CHECK_DEADLOCK TRUE
