\* cmp.par2-finished-work-p1 (comparison; expected safety): p1 rules: the timer wins over work stored succeeded before the deadline (was wit.par-timeout-with-k-stored).
SPECIFICATION Spec
CONSTANTS
    N = 2
    K = 1
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {2}
    CanFail = {1, 2}
    Hang = {}
    AllowSkew = TRUE
    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = TRUE
    AllowEndFail = TRUE
    MaxCrash = 1
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "p1"
    TimeoutCounts = "work"
    JoinCheck = "none"
    StoreCutsOnTimeout = TRUE
    EndFailRetries = FALSE
    MaxEndFail = 0
    PauseSeen = "collect"
    EndBudget = "forced"
    EndForever = FALSE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_FinishedWorkWins
CHECK_DEADLOCK TRUE
