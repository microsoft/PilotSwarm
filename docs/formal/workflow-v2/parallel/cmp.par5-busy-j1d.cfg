\* cmp.par5-busy-j1d (comparison; expected liveness): J1d-R1 at J1d: a busy run never reaches the idle wait, so an owed end is never tried again.
SPECIFICATION LiveSpec
CONSTANTS
    N = 2
    K = 1
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = TRUE
    Agents = {1, 2}
    CanFail = {1, 2}
    Hang = {2}
    AllowSkew = FALSE
    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = FALSE
    AllowEndFail = TRUE
    MaxCrash = 0
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "decided"
    TimeoutCounts = "work"
    JoinCheck = "work"
    StoreCutsOnTimeout = TRUE
    EndFailRetries = TRUE
    MaxEndFail = 0
    PauseSeen = "collect"
    EndBudget = "owe"
    EndForever = FALSE
    RetryAt = "idle-paused"
    BusyAfter = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
PROPERTIES
    Prop_OwedEnded
CHECK_DEADLOCK TRUE
