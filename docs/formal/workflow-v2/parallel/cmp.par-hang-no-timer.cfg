\* cmp.par-hang-no-timer (comparison; expected liveness): Without timeoutSeconds, a hung branch blocks the join forever (the reason for the timer).
SPECIFICATION LiveSpec
CONSTANTS
    N = 3
    K = 2
    JoinAll = FALSE
    Conc = 3
    FailFast = FALSE
    HasTimer = FALSE
    Agents = {2}
    CanFail = {1, 2, 3}
    Hang = {2, 3}
    AllowSkew = FALSE
    AllowPause = TRUE
    PausedCancel = "now"
    ResumeFair = TRUE
    AllowRunEnd = TRUE
    AllowEndFail = TRUE
    MaxCrash = 0
    MaxCan = 0
    CancelFirst = FALSE
    Rules = "p1"
    TimeoutCounts = "work"
    JoinCheck = "none"
    StoreCutsOnTimeout = FALSE
    EndFailRetries = FALSE
    MaxEndFail = 0
    PauseSeen = "collect"
    EndBudget = "forced"
    EndForever = FALSE
    RetryAt = "idle-paused"
    BusyAfter = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
PROPERTIES
    Prop_Decided
CHECK_DEADLOCK TRUE
