\* wit-lc-recover-start-fails: as lc-hd-notify-faults-qualified with controller death: a recover ends the run, and its notifier start fails for good; expected safety violation (witness)
SPECIFICATION Spec
CONSTANTS
    Cancellers = {"parent", "other"}
    LegacyWriter = "none"
    CancelEndsBeforeBegin = TRUE
    BeginHonorsReceipt = TRUE
    C2Fix = TRUE
    LoseDispatch = TRUE
    DropOrphans = TRUE
    Interrupts = TRUE
    Repeats = TRUE
    Recovery = TRUE
    ControllerDeath = TRUE
    NotifyEnabled = TRUE
    NotifyFaults = TRUE
    AuthorityLoss = TRUE
    MaxCrashes = 1
INVARIANT Wit_RecoverStartFails
CHECK_DEADLOCK FALSE
