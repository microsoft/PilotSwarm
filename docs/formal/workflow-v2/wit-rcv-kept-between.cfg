\* wit-rcv-kept-between: as rcv-hd-safety: an input given after receive state 1 elapsed, while no receive waits, is kept (no receive in its receipt), and receive state 2 takes it at its entry; expected safety violation (witness)
SPECIFICATION Spec
CONSTANTS
    Secs = 2
    HasWait = TRUE
    Ttl = 2
    MaxPre = 2
    Matching = {1, 2}
    From = "p"
    Sender1 = "p"
    Sender2 = "q"
    Authorized = {"p", "q"}
    Deletes = TRUE
    Cancels = TRUE
    AdmitDecides = TRUE
    AcceptDecides = TRUE
    OneReading = TRUE
    Granule = 1
    ReceiptStored = TRUE
    EntryClaim = TRUE
    IngressClaim = TRUE
    DeadlineCheck = TRUE
    ConsumeOnClaim = TRUE
    EarliestFirst = TRUE
    FitCheck = TRUE
    Cas = TRUE
INVARIANT Wit_KeptBetween
CHECK_DEADLOCK FALSE
