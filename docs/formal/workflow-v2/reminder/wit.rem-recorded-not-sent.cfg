\* wit.rem-recorded-not-sent (witness; expected safety): Design: a recorded reminder that a Stop (or pending work) keeps from being sent still counts toward the 3.
SPECIFICATION Spec
CONSTANTS
    MaxTurns = 2
    Max = 3
    MaxRetry = 1
    AllowStop = TRUE
    AllowInterrupt = TRUE
    AllowSteer = TRUE
    AllowHeld = TRUE
    AllowQueued = TRUE
    AllowGuard = TRUE
    AllowCron = TRUE
    AllowSub = TRUE
    AllowSendFail = TRUE
    AllowStoreHang = FALSE
    AllowSendHang = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    W_RecordedAlwaysSent
CHECK_DEADLOCK TRUE
