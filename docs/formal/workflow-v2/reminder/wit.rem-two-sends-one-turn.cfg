\* wit.rem-two-sends-one-turn (witness; expected safety): Design: an activity re-run of the same turn reminds again under its recorded number.
SPECIFICATION Spec
CONSTANTS
    MaxTurns = 2
    Max = 3
    MaxRetry = 1
    AllowStop = TRUE
    AllowInterrupt = TRUE
    AllowSteer = TRUE
    AllowHeld = TRUE
    AllowQueued = TRUE
    AllowGuard = TRUE
    AllowCron = TRUE
    AllowSub = TRUE
    AllowSendFail = TRUE
    AllowStoreHang = FALSE
    AllowSendHang = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    W_OneSendPerTurn
CHECK_DEADLOCK TRUE
