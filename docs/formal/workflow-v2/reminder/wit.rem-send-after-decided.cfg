\* wit.rem-send-after-decided (witness; expected safety): Design limit: the step expires between the store's record and the send; the child gets a reminder for a decided step.
SPECIFICATION Spec
CONSTANTS
    MaxTurns = 2
    Max = 3
    MaxRetry = 1
    AllowStop = TRUE
    AllowInterrupt = TRUE
    AllowSteer = TRUE
    AllowHeld = TRUE
    AllowQueued = TRUE
    AllowGuard = TRUE
    AllowCron = TRUE
    AllowSub = TRUE
    AllowSendFail = TRUE
    AllowStoreHang = FALSE
    AllowSendHang = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    W_NoSendAfterDecided
CHECK_DEADLOCK TRUE
