\* cmp.rem-send-hang (comparison; expected liveness): Assumption: send() of the reminder prompt is not raced with Stop; a CLI that never accepts or refuses holds Stop.
SPECIFICATION LiveSpec
CONSTANTS
    MaxTurns = 2
    Max = 3
    MaxRetry = 1
    AllowStop = TRUE
    AllowInterrupt = TRUE
    AllowSteer = TRUE
    AllowHeld = TRUE
    AllowQueued = TRUE
    AllowGuard = TRUE
    AllowCron = TRUE
    AllowSub = TRUE
    AllowSendFail = TRUE
    AllowStoreHang = FALSE
    AllowSendHang = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
PROPERTIES
    Prop_StopTakesEffect
CHECK_DEADLOCK TRUE
