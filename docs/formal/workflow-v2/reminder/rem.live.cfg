\* rem.live (reviewed; expected PASS): A stalled step is reminded or decided; the step ends; Stop always ends the turn.
SPECIFICATION LiveSpec
CONSTANTS
    MaxTurns = 2
    Max = 3
    MaxRetry = 1
    AllowStop = TRUE
    AllowInterrupt = TRUE
    AllowSteer = TRUE
    AllowHeld = TRUE
    AllowQueued = TRUE
    AllowGuard = TRUE
    AllowCron = TRUE
    AllowSub = TRUE
    AllowSendFail = TRUE
    AllowStoreHang = FALSE
    AllowSendHang = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_OneSendPerAttempt
    Inv_OneRecordPerTurn
    Inv_RecordsCap
    Inv_SendsBounded
    Inv_SendHasRecord
    Inv_NoSendWhileWorkPending
    Inv_EventAfterAccept
    Inv_NoRecordAfterDecided
PROPERTIES
    Prop_StalledReminded
    Prop_StepEnds
    Prop_StopTakesEffect
CHECK_DEADLOCK TRUE
