\* fault.rem-gate-not-raced (fault; expected liveness): The gate is not raced with Stop (before review D2): a store call that never answers blocks Stop.
SPECIFICATION LiveSpec
CONSTANTS
    MaxTurns = 2
    Max = 3
    MaxRetry = 1
    AllowStop = TRUE
    AllowInterrupt = TRUE
    AllowSteer = TRUE
    AllowHeld = TRUE
    AllowQueued = TRUE
    AllowGuard = TRUE
    AllowCron = TRUE
    AllowSub = TRUE
    AllowSendFail = TRUE
    AllowStoreHang = TRUE
    AllowSendHang = FALSE
    Fault = "gate-not-raced"
INVARIANTS
    TypeOK
PROPERTIES
    Prop_StopTakesEffect
CHECK_DEADLOCK TRUE
