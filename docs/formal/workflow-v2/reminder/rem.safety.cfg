\* rem.safety (reviewed; expected PASS): Two turns and one activity re-run; Stop, interrupt, steer, held controls, queued message, guard, schedule, sub-agent, deadline, send failure at any point.
SPECIFICATION Spec
CONSTANTS
    MaxTurns = 2
    Max = 3
    MaxRetry = 1
    AllowStop = TRUE
    AllowInterrupt = TRUE
    AllowSteer = TRUE
    AllowHeld = TRUE
    AllowQueued = TRUE
    AllowGuard = TRUE
    AllowCron = TRUE
    AllowSub = TRUE
    AllowSendFail = TRUE
    AllowStoreHang = FALSE
    AllowSendHang = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_OneSendPerAttempt
    Inv_OneRecordPerTurn
    Inv_RecordsCap
    Inv_SendsBounded
    Inv_SendHasRecord
    Inv_NoSendWhileWorkPending
    Inv_EventAfterAccept
    Inv_NoRecordAfterDecided
CHECK_DEADLOCK TRUE
