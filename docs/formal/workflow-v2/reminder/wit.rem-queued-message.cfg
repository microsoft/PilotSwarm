\* wit.rem-queued-message (witness; expected safety): Documented limit: a message queued for the child is not seen; the reminder is still sent.
SPECIFICATION Spec
CONSTANTS
    MaxTurns = 2
    Max = 3
    MaxRetry = 1
    AllowStop = TRUE
    AllowInterrupt = TRUE
    AllowSteer = TRUE
    AllowHeld = TRUE
    AllowQueued = TRUE
    AllowGuard = TRUE
    AllowCron = TRUE
    AllowSub = TRUE
    AllowSendFail = TRUE
    AllowStoreHang = FALSE
    AllowSendHang = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    W_NoQueuedSend
CHECK_DEADLOCK TRUE
