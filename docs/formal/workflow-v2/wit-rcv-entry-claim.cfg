\* wit-rcv-entry-claim: as rcv-hd-safety: a receive takes at its entry an input accepted before it; expected safety violation (witness)
SPECIFICATION Spec
CONSTANTS
    Secs = 2
    HasWait = TRUE
    Ttl = 2
    MaxPre = 2
    Matching = {1, 2}
    From = "p"
    Sender1 = "p"
    Sender2 = "q"
    Authorized = {"p", "q"}
    Deletes = TRUE
    Cancels = TRUE
    AdmitDecides = TRUE
    AcceptDecides = TRUE
    OneReading = TRUE
    Granule = 1
    ReceiptStored = TRUE
    EntryClaim = TRUE
    IngressClaim = TRUE
    DeadlineCheck = TRUE
    ConsumeOnClaim = TRUE
    EarliestFirst = TRUE
    Cas = TRUE
INVARIANT Wit_EntryClaim
CHECK_DEADLOCK FALSE
