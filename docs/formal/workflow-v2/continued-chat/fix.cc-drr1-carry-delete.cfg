    EndMark = TRUE
    StopBeforeSpawn = TRUE
    PerChatEnd = TRUE
    StopAtRunEnd = TRUE
    Fault = "none"
    SplitSpawn = TRUE
    CheckAll = TRUE
    Fence = "after"
    Backstop = TRUE
    AllowSpawnCrash = TRUE
    MarkSplit = TRUE
    MarkFail = "none"
    Withdraw = FALSE
    Outbox = FALSE
    Carry = TRUE
    CarryDelete = "owed"
    TurnGuard = FALSE
    MarkCreating = FALSE
    CarryNotFound = FALSE
INVARIANTS
    TypeOK
    Inv_NoOrphanRun
    Inv_NoRevive
    Inv_PromptNotDropped
