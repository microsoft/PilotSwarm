\* fault.no-owed-mark (expected liveness): An agent session not visible yet at the run's end is marked ended instead of owed: it starts later and is never ended.
SPECIFICATION LiveSpec
CONSTANTS
    V = 3
    Person = "none"
    AllowStop = FALSE
    AllowCancel = TRUE
    AllowStopFail = FALSE
    FailChat = 0
    RecoverFair = FALSE
    SpawnRecheck = FALSE
    StopBeforeSpawn = FALSE
    PerChatEnd = FALSE
    StopAtRunEnd = FALSE
    Fault = "no-owed-mark"
INVARIANTS
    TypeOK
    Inv_OneLive
    Inv_ResultOwnVisit
    Inv_ReplaceOnlyEnded
    Inv_NoTurnForDecided
    Inv_EndOnce
PROPERTIES
    Prop_AllEnded
CHECK_DEADLOCK FALSE
