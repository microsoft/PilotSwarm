\* fix.cc-drr2-carry-live (expected PASS): DRR-2 fix (proposed), the Workflow carries the end: every visit decided, every agent session ended, owed ends sent.
SPECIFICATION LiveSpec
CONSTANTS
    V = 3
    Person = "any"
    AllowStop = TRUE
    AllowCancel = TRUE
    AllowStopFail = TRUE
    FailChat = 0
    RecoverFair = FALSE
    SpawnRecheck = TRUE
    RecheckSeesEnding = FALSE
    EndMark = TRUE
    StopBeforeSpawn = TRUE
    PerChatEnd = TRUE
    StopAtRunEnd = TRUE
    Fault = "none"
    SplitSpawn = TRUE
    CheckAll = TRUE
    Fence = "both"
    Backstop = TRUE
    AllowSpawnCrash = FALSE
    MarkSplit = TRUE
    MarkFail = "crash"
    Withdraw = FALSE
    Outbox = FALSE
    Carry = TRUE
    CarryDelete = "none"
    TurnGuard = FALSE
    MarkCreating = FALSE
    CarryNotFound = FALSE
INVARIANTS
    TypeOK
    Inv_OneLive
    Inv_ResultOwnVisit
    Inv_ReplaceOnlyEnded
    Inv_NoTurnForDecided
    Inv_EndOnce
PROPERTIES
    Prop_VisitsDecided
    Prop_AllEnded
    Prop_OwedSent
CHECK_DEADLOCK TRUE
