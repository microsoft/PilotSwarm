    AllowStopFail = FALSE
    FailChat = 0
    RecoverFair = FALSE
    SpawnRecheck = TRUE
    RecheckSeesEnding = FALSE
    EndMark = TRUE
    StopBeforeSpawn = TRUE
    PerChatEnd = TRUE
    StopAtRunEnd = TRUE
    Fault = "none"
    SplitSpawn = TRUE
    CheckAll = TRUE
    Fence = "both"
    Backstop = TRUE
    AllowSpawnCrash = FALSE
    MarkSplit = TRUE
    MarkFail = "throw"
    Withdraw = TRUE
    Outbox = FALSE
    Carry = FALSE
    CarryDelete = "none"
    TurnGuard = FALSE
    MarkCreating = FALSE
    CarryNotFound = FALSE
INVARIANTS
    TypeOK
    Inv_OneLive
    Inv_NoAbandonedLive
    Inv_NoFailOnLive
CHECK_DEADLOCK FALSE
