\* fix.cc-drr2-carry-throw (expected PASS): DRR-2 fix (proposed), the Workflow carries the end: the person's command failed; a visit that acts on the mark first queues its end, so no agent session is abandoned and no visit fails on a live one.
SPECIFICATION Spec
CONSTANTS
    V = 3
    Person = "end"
    AllowStop = TRUE
    AllowCancel = TRUE
    AllowStopFail = TRUE
    FailChat = 0
    RecoverFair = FALSE
    SpawnRecheck = TRUE
    RecheckSeesEnding = FALSE
    EndMark = TRUE
    StopBeforeSpawn = TRUE
    PerChatEnd = TRUE
    StopAtRunEnd = TRUE
    Fault = "none"
    SplitSpawn = TRUE
    CheckAll = TRUE
    Fence = "both"
    Backstop = TRUE
    AllowSpawnCrash = FALSE
    MarkSplit = TRUE
    MarkFail = "throw"
    Withdraw = FALSE
    Outbox = FALSE
    Carry = TRUE
    CarryDelete = "none"
    TurnGuard = FALSE
    MarkCreating = FALSE
    CarryNotFound = FALSE
INVARIANTS
    TypeOK
    Inv_OneLive
    Inv_NoAbandonedLive
    Inv_NoFailOnLive
    TypeOK
    Inv_ResultOwnVisit
    Inv_ReplaceOnlyEnded
    Inv_NoTurnForDecided
    Inv_EndOnce
    Inv_PromptNotDropped
    Inv_NoLoudFail
    Inv_NoPromptBehindStaleTurn
    Inv_StopAtRunEnd
    Inv_NoRevive
CHECK_DEADLOCK TRUE
