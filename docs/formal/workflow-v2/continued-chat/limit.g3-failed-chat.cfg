\* limit.g3-failed-chat (expected liveness): The agent session whose end fails past every retry stays open until a person runs recover (recover is on request).
SPECIFICATION LiveSpec
CONSTANTS
    V = 3
    Person = "none"
    AllowStop = TRUE
    AllowCancel = TRUE
    AllowStopFail = FALSE
    FailChat = 1
    RecoverFair = FALSE
    SpawnRecheck = FALSE
    StopBeforeSpawn = FALSE
    PerChatEnd = TRUE
    StopAtRunEnd = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_OneLive
    Inv_ResultOwnVisit
    Inv_ReplaceOnlyEnded
    Inv_NoTurnForDecided
    Inv_EndOnce
PROPERTIES
    Prop_AllEnded
CHECK_DEADLOCK FALSE
