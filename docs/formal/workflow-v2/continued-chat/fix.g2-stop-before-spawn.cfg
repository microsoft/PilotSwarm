\* fix.g2-stop-before-spawn (expected PASS): G2 fix: the next visit's spawn first sends the earlier visit's Stop again.
SPECIFICATION LiveSpec
CONSTANTS
    V = 3
    Person = "none"
    AllowStop = TRUE
    AllowCancel = TRUE
    AllowStopFail = TRUE
    FailChat = 0
    RecoverFair = FALSE
    SpawnRecheck = FALSE
    StopBeforeSpawn = TRUE
    PerChatEnd = FALSE
    StopAtRunEnd = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_OneLive
    Inv_ResultOwnVisit
    Inv_ReplaceOnlyEnded
    Inv_NoTurnForDecided
    Inv_EndOnce
    Inv_PromptNotDropped
    Inv_NoLoudFail
    Inv_NoPromptBehindStaleTurn
    Inv_StopAtRunEnd
PROPERTIES
    Prop_VisitsDecided
    Prop_AllEnded
    Prop_OwedSent
CHECK_DEADLOCK TRUE
