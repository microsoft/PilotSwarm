\* b.clean-arcs (fj3; expected PASS): A well-formed fork and join: no hazard.
SPECIFICATION Spec
CONSTANTS
    Graph = "clean"
    Sem = "free"
    JoinWaits = "arcs"
    TerminalEnds = TRUE
    ErrOn = FALSE
    MaxTok = 4
    MaxSteps = 6
INVARIANTS
    TypeOK
    Inv_NoSiblingDiscarded
    Inv_ErrorBranchLocal
    Inv_JoinExact
    Inv_NoCross
    Inv_NoTwoOnNode
    Inv_NoLoopFork
CHECK_DEADLOCK TRUE
