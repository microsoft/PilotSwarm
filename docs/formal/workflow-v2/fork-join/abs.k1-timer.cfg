\* abs.k1-timer (fj3; expected PASS): The abstract fork + join: first 1 of 3, a time limit, failFast false; no run end, so a stuck undecided state is a deadlock.
SPECIFICATION ASpec
CONSTANTS
    NB = 3
    Kneed = 1
    FailFast = FALSE
    HasTimer = TRUE
    AllowRunEnd = FALSE
    AllowEntryError = FALSE
INVARIANTS
    ATypeOK
    AInv_Joined
    AInv_Decided
    AInv_WinnersOnlyWhenJoined
    AInv_TimedOutNotImpossible
CHECK_DEADLOCK TRUE
