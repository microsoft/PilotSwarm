\* b.clean-live (fj3; expected PASS): The well-formed run ends.
SPECIFICATION LiveSpec
CONSTANTS
    Graph = "clean"
    Sem = "free"
    JoinWaits = "arcs"
    TerminalEnds = TRUE
    ErrOn = FALSE
    MaxTok = 4
    MaxSteps = 6
INVARIANTS
    TypeOK
    Inv_NoSiblingDiscarded
    Inv_ErrorBranchLocal
    Inv_JoinExact
    Inv_NoCross
    Inv_NoTwoOnNode
    Inv_NoLoopFork
PROPERTIES
    Prop_RunEnds
CHECK_DEADLOCK TRUE
