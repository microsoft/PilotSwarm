\* l.stop-hang (fj3; expected PASS): A graceful stop with a hung branch: its grace deadline ends the run and every effect settles (fj2, MF-FJ1: the stop is the environment's choice, so only properties conditioned on it are checked here; without a stop see cmp.a-hang-no-timer).
SPECIFICATION LiveSpec
CONSTANTS
    NB = 2
    Two = {}
    Err = {}
    Loop = {}
    AgentBr = {2}
    CanFail = {1, 2}
    Hang = {2}
    K = 1
    JoinAll = TRUE
    Conc = 2
    FailFast = FALSE
    HasTimer = FALSE
    ForkRoutes = "all"
    HasCatchAll = FALSE
    Limit = 6
    AllowPause = FALSE
    ResumeFair = TRUE
    AllowStop = TRUE
    AllowCancel = FALSE
    MaxCrash = 0
    EntryErr = FALSE
    StopFence = "fork"
    AllJoinPath = "store"
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_OneDecision
    Inv_JoinedK
    Inv_WinnersCommitOrder
    Inv_WinnersOnTime
    Inv_VisitIsolated
    Inv_BlockedOnlyWhenImpossible
    Inv_FailFastFalseWaits
    Inv_ReportComplete
    Inv_ReportKeepsFinished
    Inv_NoStartAfterDecision
    Inv_NoRouteAfterDecision
    Inv_QueuedNeverStarted
    Inv_Concurrency
    Inv_StepsBound
    Inv_LimitExact
    Inv_BranchConfined
    Inv_RowsOwned
    Inv_ModelKeysDistinct
    Inv_StopLetsStartedFinish
    Inv_EndedNothingPending
    Inv_DroppedNoPending
    Inv_CutMeansAsked
    Inv_NoSettleAfterStop
    Inv_CutOnlyWithDecision
PROPERTIES
    Prop_StopEnds
    Prop_StopSettles
CHECK_DEADLOCK TRUE
