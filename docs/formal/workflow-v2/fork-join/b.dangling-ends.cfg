\* b.dangling-ends (fj3; expected VIOLATION:Inv_NoSiblingDiscarded): A terminal inside a branch ends the run while the other branch runs.
SPECIFICATION Spec
CONSTANTS
    Graph = "dangling"
    Sem = "free"
    JoinWaits = "arcs"
    TerminalEnds = TRUE
    ErrOn = FALSE
    MaxTok = 4
    MaxSteps = 6
INVARIANTS
    Inv_NoSiblingDiscarded
CHECK_DEADLOCK FALSE
