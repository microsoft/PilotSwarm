\* b.chain-count (fj3; expected PASS): A well-formed fork with a two-state branch, count join.
SPECIFICATION Spec
CONSTANTS
    Graph = "chain"
    Sem = "free"
    JoinWaits = "count"
    TerminalEnds = TRUE
    ErrOn = FALSE
    MaxTok = 4
    MaxSteps = 6
INVARIANTS
    TypeOK
    Inv_NoSiblingDiscarded
    Inv_ErrorBranchLocal
    Inv_JoinExact
    Inv_NoCross
    Inv_NoTwoOnNode
    Inv_NoLoopFork
CHECK_DEADLOCK TRUE
