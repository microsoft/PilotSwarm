\* b.dangling-waits (fj3; expected VIOLATION:Prop_RunEnds): The terminal ends only its token: the join waits forever for it.
SPECIFICATION LiveSpec
CONSTANTS
    Graph = "dangling"
    Sem = "free"
    JoinWaits = "arcs"
    TerminalEnds = FALSE
    ErrOn = FALSE
    MaxTok = 4
    MaxSteps = 6
INVARIANTS
    TypeOK
PROPERTIES
    Prop_RunEnds
CHECK_DEADLOCK FALSE
