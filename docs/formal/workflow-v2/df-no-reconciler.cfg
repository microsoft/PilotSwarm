\* df-no-reconciler: this commit without the reader's reconciliation; expected liveness
SPECIFICATION Spec
CONSTANTS
    MaxLoops = 1
    LoseWake = FALSE
    ControllerFaults = FALSE
    EffectFaults = FALSE
    Backstop = TRUE
    CancelStopFromStore = TRUE
    DeleteGuard = TRUE
    EntryFence = TRUE
    EndPending = TRUE
    EffectWatch = TRUE
    CommandPoll = TRUE
    Reconciler = FALSE
    CatchAll = FALSE
    ControllerDeath = TRUE
    Deletes = FALSE
    NoCas = FALSE
PROPERTY Live_Terminates
CHECK_DEADLOCK FALSE
