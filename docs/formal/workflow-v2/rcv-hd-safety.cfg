\* rcv-hd-safety: this commit, the receives' sender p (the parent or a named session), inputs from p and from q, deletions and the cancel; expected PASS
SPECIFICATION Spec
CONSTANTS
    Secs = 2
    HasWait = TRUE
    Ttl = 2
    MaxPre = 2
    Matching = {1, 2}
    From = "p"
    Sender1 = "p"
    Sender2 = "q"
    Authorized = {"p", "q"}
    Deletes = TRUE
    Cancels = TRUE
    AdmitDecides = TRUE
    AcceptDecides = TRUE
    OneReading = TRUE
    Granule = 1
    ReceiptStored = TRUE
    EntryClaim = TRUE
    IngressClaim = TRUE
    DeadlineCheck = TRUE
    ConsumeOnClaim = TRUE
    EarliestFirst = TRUE
    FitCheck = TRUE
    Cas = TRUE
INVARIANT ReceiveSafety
PROPERTY Prop_FirstResultKept
CHECK_DEADLOCK FALSE
