\* wit-rcv-late-input-expires: as rcv-hd-safety: an input late for receive state 1 is kept unclaimed but expires before receive state 2's delayed entry, which does not take it and waits; expected safety violation (witness)
SPECIFICATION Spec
CONSTANTS
    Secs = 2
    HasWait = TRUE
    Ttl = 2
    MaxPre = 2
    Matching = {1, 2}
    From = "p"
    Sender1 = "p"
    Sender2 = "q"
    Authorized = {"p", "q"}
    Deletes = TRUE
    Cancels = TRUE
    AdmitDecides = TRUE
    AcceptDecides = TRUE
    OneReading = TRUE
    Granule = 1
    ReceiptStored = TRUE
    EntryClaim = TRUE
    IngressClaim = TRUE
    DeadlineCheck = TRUE
    ConsumeOnClaim = TRUE
    EarliestFirst = TRUE
    FitCheck = TRUE
    Cas = TRUE
INVARIANT Wit_LateInputExpires
CHECK_DEADLOCK FALSE
