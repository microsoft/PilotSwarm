\* cmp.graph-queue-lost (comparison; expected liveness): Before S7-DX2 (queue): a queued cancel lost at continue-as-new (behind 100 unread messages) never ends the run.
SPECIFICATION LiveSpec
CONSTANTS
    Plan = "linear"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = TRUE
    AllowStop = FALSE
    AllowPause = FALSE
    AllowDeadline = FALSE
    AllowDelete = FALSE
    Cmd = "queue"
    AllowLoseHint = TRUE
    Fault = "none"
PROPERTIES
    Prop_CommandEnds
CHECK_DEADLOCK TRUE
