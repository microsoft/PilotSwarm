\* graph.r3-linear (reviewed; expected PASS): S7-DX3 at 9a8d0f66: with direct commands, the owning chat's end, deletions (also after the end) and end retries, the parent is told at most once, only of an ended run, after its children, never of a deleted run, never by a losing command.
SPECIFICATION Spec
CONSTANTS
    Plan = "linear"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "direct"
    AllowLoseHint = TRUE
    Fault = "srt1"
    Elsewhere = "any"
    OtherEnds = {"chat", "retry", "delete_after"}
INVARIANTS
    TypeOK
    Inv_StepsBound
    Inv_EndedNothingPending
    Inv_ControllerEndsOnlyEndedRun
    Inv_CatchAllOnce
    Inv_JoinAccountsAll
    Inv_JoinedOnlyAllSucceeded
    Inv_NoProtocolFault
    Inv_BranchConfined
    Inv_NoAdmissionAfterStop
    Inv_ParallelBranchesBounded
    Inv_OneReport
    Inv_NoAdmitAfterAccept
    Inv_NoCollectAfterEnd
    Inv_NoRouteWhilePaused
    Inv_NoFailWhilePaused
    Inv_ReportOnlyEnded
    Inv_ReportAfterChildren
    Inv_DeletedNotReported
    Inv_NoticeFollowsWinner
PROPERTIES
    Prop_FirstEndWins
CHECK_DEADLOCK TRUE
