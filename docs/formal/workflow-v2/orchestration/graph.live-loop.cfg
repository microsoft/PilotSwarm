\* graph.live-loop (reviewed; expected PASS): A loop ends at its limit at the latest.
SPECIFICATION LiveSpec
CONSTANTS
    Plan = "loop"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "none"
    Elsewhere = "command"
    OtherEnds = {}
PROPERTIES
    Prop_ControllerEnds
    Prop_RunEnds
CHECK_DEADLOCK TRUE
