\* graph.dx2-loop (reviewed; expected PASS): S7-DX2 on a loop that reaches its node limit: the same rules.
SPECIFICATION Spec
CONSTANTS
    Plan = "loop"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "direct"
    AllowLoseHint = TRUE
    Fault = "none"
    Elsewhere = "command"
    OtherEnds = {}
INVARIANTS
    TypeOK
    Inv_StepsBound
    Inv_EndedNothingPending
    Inv_ControllerEndsOnlyEndedRun
    Inv_CatchAllOnce
    Inv_JoinAccountsAll
    Inv_JoinedOnlyAllSucceeded
    Inv_NoProtocolFault
    Inv_BranchConfined
    Inv_NoAdmissionAfterStop
    Inv_ParallelBranchesBounded
    Inv_OneReport
    Inv_NoAdmitAfterAccept
    Inv_NoCollectAfterEnd
PROPERTIES
    Prop_FirstEndWins
CHECK_DEADLOCK TRUE
