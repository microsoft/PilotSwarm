\* graph.dx2-linear (reviewed; expected PASS): S7-DX2: an accepted cancel or done ends the run at once (running, paused or stopping); nothing is admitted or collected after it; the first end wins. Hints may be lost.
SPECIFICATION Spec
CONSTANTS
    Plan = "linear"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "direct"
    AllowLoseHint = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_StepsBound
    Inv_EndedNothingPending
    Inv_ControllerEndsOnlyEndedRun
    Inv_CatchAllOnce
    Inv_JoinAccountsAll
    Inv_JoinedOnlyAllSucceeded
    Inv_NoProtocolFault
    Inv_BranchConfined
    Inv_NoAdmissionAfterStop
    Inv_ParallelBranchesBounded
    Inv_OneReport
    Inv_NoAdmitAfterAccept
    Inv_NoCollectAfterEnd
PROPERTIES
    Prop_FirstEndWins
CHECK_DEADLOCK TRUE
