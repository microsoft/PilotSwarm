\* graph.live-par (reviewed; expected PASS): A parallel run ends with every environment choice.
SPECIFICATION LiveSpec
CONSTANTS
    Plan = "par"
    Limit = 7
    K = 2
    Conc = 1
    FailFast = TRUE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "none"
    Elsewhere = "command"
    OtherEnds = {}
PROPERTIES
    Prop_ControllerEnds
    Prop_RunEnds
CHECK_DEADLOCK TRUE
