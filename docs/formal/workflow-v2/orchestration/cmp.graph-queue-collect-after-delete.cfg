\* cmp.graph-queue-collect-after-delete (comparison; expected safety): Before S7-DX2: 1.9.0's collect did not report an ended run, so a deleted run's results were collected for routing.
SPECIFICATION Spec
CONSTANTS
    Plan = "linear"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = FALSE
    AllowStop = FALSE
    AllowPause = FALSE
    AllowDeadline = FALSE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_NoCollectAfterEnd
CHECK_DEADLOCK TRUE
