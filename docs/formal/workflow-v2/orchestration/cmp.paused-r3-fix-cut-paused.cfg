\* cmp.paused-r3-fix-cut-paused (comparison; expected PASS): R3-P1 fix (proposed): the cut also ends, or owes, the child of a cut branch's decided agent state whose end is not recorded; the paused findings pass.
SPECIFICATION LiveSpec
CONSTANTS
    Code = "proposedR3"
    AllowResume = FALSE
    AllowChildComplete = TRUE
    AllowEndFail = TRUE
    PauseFirst = TRUE
    TimedJoin = TRUE
    AllowEndElsewhere = FALSE
    AllowCutFail = TRUE
    AllowPause = TRUE
PROPERTIES
    Prop_DoneChildEnded
    Prop_TimedOutChildEnded
    Prop_CutChildEnded
    Prop_OwedCutMade
    Prop_TimedJoinDecided
CHECK_DEADLOCK TRUE
