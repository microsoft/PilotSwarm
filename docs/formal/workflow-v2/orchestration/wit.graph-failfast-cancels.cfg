\* wit.graph-failfast-cancels (reviewed; expected safety): failFast cancels a running branch.
SPECIFICATION Spec
CONSTANTS
    Plan = "par"
    Limit = 7
    K = 2
    Conc = 2
    FailFast = TRUE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "none"
INVARIANTS
    Wit_FailFastCancels
CHECK_DEADLOCK TRUE
