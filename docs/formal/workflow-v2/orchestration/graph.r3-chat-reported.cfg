    Plan = "linear"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = FALSE
    AllowStop = FALSE
    AllowPause = FALSE
    AllowDeadline = FALSE
    AllowDelete = FALSE
    Cmd = "direct"
    AllowLoseHint = FALSE
    Fault = "srt1"
    Elsewhere = "any"
    OtherEnds = {"chat"}
PROPERTIES
    Prop_EndedElsewhereReported
CHECK_DEADLOCK TRUE
