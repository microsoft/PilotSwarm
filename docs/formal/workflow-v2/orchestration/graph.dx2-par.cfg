\* graph.dx2-par (reviewed; expected PASS): S7-DX2 on a parallel state, two branches at once, failFast: the same rules.
SPECIFICATION Spec
CONSTANTS
    Plan = "par"
    Limit = 7
    K = 2
    Conc = 2
    FailFast = TRUE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "direct"
    AllowLoseHint = TRUE
    Fault = "none"
INVARIANTS
    TypeOK
    Inv_StepsBound
    Inv_EndedNothingPending
    Inv_ControllerEndsOnlyEndedRun
    Inv_CatchAllOnce
    Inv_JoinAccountsAll
    Inv_JoinedOnlyAllSucceeded
    Inv_NoProtocolFault
    Inv_BranchConfined
    Inv_NoAdmissionAfterStop
    Inv_ParallelBranchesBounded
    Inv_OneReport
    Inv_NoAdmitAfterAccept
    Inv_NoCollectAfterEnd
PROPERTIES
    Prop_FirstEndWins
CHECK_DEADLOCK TRUE
