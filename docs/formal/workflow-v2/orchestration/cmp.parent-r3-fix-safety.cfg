\* cmp.parent-r3-fix-safety (comparison; expected PASS): The R3-P1 fix with a request, other ends, the parent's end, zombies and a second notifier.
SPECIFICATION Spec
CONSTANTS
    MKind = "request"
    StartFlag = "omitted"
    MaxCrashes = 1
    AllowExternalEnd = TRUE
    AllowParentCancel = TRUE
    AllowParentEnd = TRUE
    AllowFifoFull = FALSE
    AllowEvict = FALSE
    AllowClockBack = FALSE
    MaxTurnFails = 1
    Fault = "none"
    AllowWaitTimeout = FALSE
    AllowZombie = TRUE
    NumNotifiers = 2
    AllowStatusRace = TRUE
    AllowNtZombie = TRUE
    AllowRecover = FALSE
    MaxRecovers = 0
    RecoverAfterRelease = FALSE
    AllowLateStart = TRUE
    Code = "proposedNoteTx"
INVARIANTS
    TypeOK
    Inv_EndedIsLast
    Inv_GivenOnce
    Inv_SkipMeansNotGiven
    Inv_NotifiedXorSkipped
    Inv_NoDecisionAfterExpiry
    Inv_NotedMeansKept
    Inv_NoNoteAfterGone
    Inv_NoteGivenConsumed
    Inv_NoteIsLast
    Inv_ToldOnce
CHECK_DEADLOCK TRUE
