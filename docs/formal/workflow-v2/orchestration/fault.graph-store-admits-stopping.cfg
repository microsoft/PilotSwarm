\* fault.graph-store-admits-stopping (deliberate; expected safety): The store admits a node of a stopping run.
SPECIFICATION Spec
CONSTANTS
    Plan = "linear"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "store_admits_stopping"
    Elsewhere = "command"
    OtherEnds = {}
INVARIANTS
    Inv_NoAdmissionAfterStop
CHECK_DEADLOCK TRUE
