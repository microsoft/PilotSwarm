\* cmp.parent-r3-fix-told-once (comparison; expected PASS): The R3-P1 fix: the note and its skip in one transaction; the end is given once.
SPECIFICATION Spec
CONSTANTS
    MKind = "send"
    StartFlag = "omitted"
    MaxCrashes = 1
    AllowExternalEnd = FALSE
    AllowParentCancel = FALSE
    AllowParentEnd = FALSE
    AllowFifoFull = FALSE
    AllowEvict = FALSE
    AllowClockBack = FALSE
    MaxTurnFails = 1
    Fault = "none"
    AllowWaitTimeout = FALSE
    AllowZombie = FALSE
    NumNotifiers = 1
    AllowStatusRace = TRUE
    AllowNtZombie = FALSE
    AllowRecover = FALSE
    MaxRecovers = 0
    RecoverAfterRelease = FALSE
    AllowLateStart = TRUE
    Code = "proposedNoteTx"
INVARIANTS
    TypeOK
    Inv_EndedIsLast
    Inv_GivenOnce
    Inv_SkipMeansNotGiven
    Inv_NotifiedXorSkipped
    Inv_NoDecisionAfterExpiry
    Inv_NotedMeansKept
    Inv_NoNoteAfterGone
    Inv_NoteGivenConsumed
    Inv_NoteIsLast
    Inv_ToldOnce
CHECK_DEADLOCK TRUE
