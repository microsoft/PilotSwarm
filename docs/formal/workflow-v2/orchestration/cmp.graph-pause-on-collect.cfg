    Plan = "par"
    Limit = 7
    K = 2
    Conc = 2
    FailFast = TRUE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "fix_pause_on_collect"
    Elsewhere = "command"
    OtherEnds = {}
INVARIANTS
    TypeOK
    Inv_StepsBound
    Inv_EndedNothingPending
    Inv_ControllerEndsOnlyEndedRun
    Inv_CatchAllOnce
    Inv_JoinAccountsAll
    Inv_JoinedOnlyAllSucceeded
    Inv_NoProtocolFault
    Inv_BranchConfined
    Inv_NoAdmissionAfterStop
    Inv_ParallelBranchesBounded
    Inv_OneReport
    Inv_NoRouteWhilePaused
CHECK_DEADLOCK TRUE
