\* fault.graph-branch-catchall (deliberate; expected safety): A branch's unrouted error goes to the catch-all.
SPECIFICATION Spec
CONSTANTS
    Plan = "parc"
    Limit = 7
    K = 2
    Conc = 2
    FailFast = TRUE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "branch_catchall"
    Elsewhere = "command"
    OtherEnds = {}
INVARIANTS
    Inv_BranchConfined
CHECK_DEADLOCK TRUE
