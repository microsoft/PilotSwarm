\* wit.graph-stopped-with-work (reviewed; expected safety): A stop ends a run with work still pending.
SPECIFICATION Spec
CONSTANTS
    Plan = "par"
    Limit = 7
    K = 2
    Conc = 2
    FailFast = TRUE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "none"
INVARIANTS
    Wit_StoppedWithWork
CHECK_DEADLOCK TRUE
