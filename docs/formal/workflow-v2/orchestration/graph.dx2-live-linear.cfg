\* graph.dx2-live-linear (reviewed; expected PASS): S7-DX2: every accepted command ends the run by its own transaction; the controller ends and tells the parent, also with every hint lost.
SPECIFICATION LiveSpec
CONSTANTS
    Plan = "linear"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "direct"
    AllowLoseHint = TRUE
    Fault = "none"
    Elsewhere = "command"
    OtherEnds = {}
PROPERTIES
    Prop_ControllerEnds
    Prop_RunEnds
    Prop_CommandEnds
    Prop_CommandTold
CHECK_DEADLOCK TRUE
