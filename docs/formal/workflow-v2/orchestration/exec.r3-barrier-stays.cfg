\* exec.r3-barrier-stays (reviewed; expected liveness): 9a8d0f66 (by design): the cause of a call that did not end is never lifted by the call's end; only a worker restart lifts it (not modeled).
SPECIFICATION LiveSpec
CONSTANTS
    N = 2
    Dep = FALSE
    AllowTeardownFail = FALSE
    AllowShutdown = FALSE
    AllowRevoke = FALSE
    AllowScriptEnd = FALSE
    Fault = "none"
    Code = "9a8d0f66"
    AllowUnsettled = TRUE
    AllowUnattributed = FALSE
    AllowBoundary = FALSE
    AllowListingFail = FALSE
    AllowLate = FALSE
    ListingRace = FALSE
PROPERTIES
    Prop_BarrierCleared
CHECK_DEADLOCK TRUE
