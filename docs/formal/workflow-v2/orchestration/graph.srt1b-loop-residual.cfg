\* graph.srt1b-loop-residual (reviewed; expected safety): S-RT1b residual (stated by the commit): a pause between a collection and the next admission lets 1.8.0 end the run at its node limit.
SPECIFICATION Spec
CONSTANTS
    Plan = "loop"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = FALSE
    AllowStop = FALSE
    AllowPause = TRUE
    AllowDeadline = FALSE
    AllowDelete = FALSE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "srt1b"
INVARIANTS
    TypeOK
    Inv_NoFailWhilePaused
CHECK_DEADLOCK TRUE
