    AllowPause = FALSE
    AllowDeadline = FALSE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "srt1"
    Elsewhere = "any"
    OtherEnds = {"chat"}
INVARIANTS
    TypeOK
    Inv_NoticeFollowsWinner
    Inv_DeletedNotReported
    Inv_OneReport
    Inv_ReportOnlyEnded
    Inv_NoCollectAfterEnd
