\* graph.live-linear (reviewed; expected PASS): Every run ends and its controller ends.
SPECIFICATION LiveSpec
CONSTANTS
    Plan = "linear"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = TRUE
    AllowStop = TRUE
    AllowPause = TRUE
    AllowDeadline = TRUE
    AllowDelete = TRUE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "none"
    Elsewhere = "command"
    OtherEnds = {}
PROPERTIES
    Prop_ControllerEnds
    Prop_RunEnds
CHECK_DEADLOCK TRUE
