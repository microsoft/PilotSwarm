\* cmp.graph-queue-terminal-first (comparison; expected liveness): Before S7-DX2 (queue): a terminal admitted first finishes the run while the accepted cancel waits in the queue.
SPECIFICATION LiveSpec
CONSTANTS
    Plan = "linear"
    Limit = 4
    K = 1
    Conc = 1
    FailFast = FALSE
    AllowCancel = TRUE
    AllowStop = FALSE
    AllowPause = FALSE
    AllowDeadline = FALSE
    AllowDelete = FALSE
    Cmd = "queue"
    AllowLoseHint = FALSE
    Fault = "none"
PROPERTIES
    Prop_CommandEnds
CHECK_DEADLOCK TRUE
