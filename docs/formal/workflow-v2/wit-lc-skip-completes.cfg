\* wit-lc-skip-completes: as lc-hd-notify-faults-qualified, deliveries that run out excluded: the notifier finds the parent's authority gone, records a skip and completes; expected safety violation (witness)
SPECIFICATION Spec
CONSTANTS
    Cancellers = {"parent", "other"}
    LegacyWriter = "none"
    CancelEndsBeforeBegin = TRUE
    BeginHonorsReceipt = TRUE
    C2Fix = TRUE
    LoseDispatch = TRUE
    DropOrphans = TRUE
    Interrupts = TRUE
    Repeats = TRUE
    Recovery = TRUE
    ControllerDeath = FALSE
    NotifyEnabled = TRUE
    NotifyFaults = FALSE
    AuthorityLoss = TRUE
    MaxCrashes = 1
INVARIANT Wit_SkipCompletes
CHECK_DEADLOCK FALSE
