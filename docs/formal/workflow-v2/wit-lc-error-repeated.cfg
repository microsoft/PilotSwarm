CONSTANTS
    Cancellers = {"parent", "other"}
    LegacyWriter = "none"
    CancelEndsBeforeBegin = TRUE
    BeginHonorsReceipt = TRUE
    C2Fix = TRUE
    LoseDispatch = TRUE
    DropOrphans = TRUE
    Interrupts = FALSE
    Repeats = TRUE
    Recovery = TRUE
    ControllerDeath = FALSE
    NotifyEnabled = TRUE
    NotifyFaults = TRUE
    AuthorityLoss = TRUE
    MaxCrashes = 1
INVARIANT Wit_ErrorRepeated
CHECK_DEADLOCK FALSE
