\* Same bounds as rs-hd-liveness, Live_WakeSettles alone (one property instead of three). Expected PASS.
SPECIFICATION LiveSpec
CONSTANTS
  Deadline = 1
  MaxTime = 2
  Ops = {"o1"}
  Vals = {"X"}
  MaxBindings = 1
  MaxAttempts = 2
  Workers = {"w1", "w2"}
