\* Module WorkflowV2RequestSpec57. Reproduces the checkpoint 1b counterexample with the 8021c75e rule (Fault no_durable_expiry) and the clock allowed to step back, at the checkpoint 1b bounds. Expected VIOLATION of Inv_NoDecisionAfterExpiry (about 7 states).
SPECIFICATION Spec
CONSTANTS
  Deadline = 1
  MaxTime = 2
  Ops = {"o1", "o2"}
  Vals = {"X", "Y"}
  MaxBindings = 2
  MaxAttempts = 2
  Workers = {"w1", "w2"}
  AllowPurge = TRUE
  ClockMode = "rollback"
  Fault = "no_durable_expiry"
INVARIANTS
  Inv_NoDecisionAfterExpiry
CHECK_DEADLOCK TRUE
