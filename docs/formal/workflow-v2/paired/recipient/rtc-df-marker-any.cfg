\* RecipientTurnCode with fault marker_any (any attempt takes the retry marker: the pre-D-W2-1 plan), no gate refusals. Expected FAIL of Inv_C_SentRidesOwnTurn, 6 states: Bind, Begin(message) t1 carries, End(sent or threw, retrying) sets the marker, Begin(message) t2 takes it and carries, End sets badRide.
SPECIFICATION Spec
CONSTANTS
  MaxTurns = 3
  MaxRetries = 1
  MaxGateFlips = 0
  MaxArrivals = 1
  GateRule = "code"
  CodeFault = "marker_any"
INVARIANTS
  Inv_C_SentRidesOwnTurn
CHECK_DEADLOCK TRUE
