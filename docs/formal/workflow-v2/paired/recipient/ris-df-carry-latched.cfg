\* Fault carry_latched: an unsent invocation with a latched item is carried. Expected VIOLATION of Inv_NoCarryAfterUnsentLatch.
SPECIFICATION Spec
CONSTANTS
  Ex = {"e1", "e2"}
  ForgedEx = "none"
  ForgedCid = "none"
  TombCap = 1
  Fault = "carry_latched"
INVARIANTS
  Inv_NoCarryAfterUnsentLatch
CHECK_DEADLOCK TRUE
