\* Module RecipientExposureSpec (spec-first, exposure protocol r2). Expected PASS, complete: one item, two carrying activities, two executions each (redelivery and duplicates), all safety properties.
SPECIFICATION Spec
CONSTANTS
  Items = {"a"}
  MaxAtt = 2
  MaxExec = 2
  AllowAlt = FALSE
  Fault = "none"
INVARIANTS
  TypeOK
  Inv_NotDispatchedTruthful
  Inv_ExposedImpliesMarker
  Inv_CancelledStaysSettled
  Inv_CompletedFromOwnOrigin
  Inv_NoSendAfterGuard
  Inv_OnlyOwnRetryAfterExposure
  Inv_SentCanonical
  Inv_NoProtocolFault
  Inv_CoercionOnly
  Inv_EndAnswerIsApplied
PROPERTIES
  Prop_MarkerInsertOnly
  Prop_OutFinal
  Prop_ProcFinal
  Prop_CreqMonotone
CHECK_DEADLOCK TRUE
