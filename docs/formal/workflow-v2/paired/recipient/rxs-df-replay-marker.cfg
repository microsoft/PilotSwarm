\* Module RecipientExposureSpec (spec-first, exposure protocol r2). Fault replay_marker (C1). Expected VIOLATION of Inv_CancelledStaysSettled, 7 states: Latch a, CancelWrite a, StartAttempt {b}, StartExec, AdmitTxn (marker), CancelReplay a reads the marker first and records cancel_requested on the cancelled row.
SPECIFICATION Spec
CONSTANTS
  Items = {"a", "b"}
  MaxAtt = 1
  MaxExec = 1
  AllowAlt = FALSE
  Fault = "replay_marker"
INVARIANTS
  Inv_CancelledStaysSettled
CHECK_DEADLOCK TRUE
