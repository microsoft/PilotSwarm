\* Fault carry_latched: an unsent invocation with a latched cancel is carried. Expected VIOLATION of Inv_NoCarryLatchedUnsent, 5 states: Bind, Latch, StartTurn, Attempt.
SPECIFICATION Spec
CONSTANTS
  MaxTurns = 3
  MaxRetries = 1
  Fault = "carry_latched"
INVARIANTS
  Inv_NoCarryLatchedUnsent
CHECK_DEADLOCK TRUE
