\* Module RecipientExposureSpec (spec-first, exposure protocol r2). Fault no_exclude (C1). Expected VIOLATION of Inv_NoProtocolFault, 6 states: Latch a, CancelWrite a (cancelled), StartAttempt with batch {b}, StartExec, AdmitTxn finds the batch unequal to a membership that still holds a.
SPECIFICATION Spec
CONSTANTS
  Items = {"a", "b"}
  MaxAtt = 1
  MaxExec = 1
  AllowAlt = FALSE
  Fault = "no_exclude"
INVARIANTS
  Inv_NoProtocolFault
CHECK_DEADLOCK TRUE
