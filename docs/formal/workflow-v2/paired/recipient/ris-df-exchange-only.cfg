\* Fault exchange_only: the forged copy's latch also latches the genuine copy of its exchange. Expected VIOLATION of Inv_LatchOwnId.
SPECIFICATION Spec
CONSTANTS
  Ex = {"e1", "e2"}
  ForgedEx = "e1"
  ForgedCid = "e2"
  TombCap = 1
  Fault = "exchange_only"
INVARIANTS
  Inv_LatchOwnId
CHECK_DEADLOCK TRUE
