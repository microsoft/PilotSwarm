\* Fault marker_any: while the first-sending turn waits for its retry, the next turn's first attempt carries the sent invocation (a retry marker consumed by whichever turn runs next). Expected VIOLATION of Inv_SentRidesOwnTurn, 6 states: Bind, StartTurn, Attempt(TRUE, retrying), Interpose, Attempt.
SPECIFICATION Spec
CONSTANTS
  MaxTurns = 3
  MaxRetries = 1
  Fault = "marker_any"
INVARIANTS
  Inv_SentRidesOwnTurn
CHECK_DEADLOCK TRUE
