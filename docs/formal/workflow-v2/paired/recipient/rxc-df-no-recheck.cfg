\* Module RecipientExposureCode (code-derived, core pin c1bda7a2). Fault no_recheck (an answer that arrives after the run ended still sends). Expected VIOLATION of Inv_C_NoSendAfterRunEnded, 6 states: StartAttempt, StartExec, Guard (admission in flight), AdmitTxn (allowed, answer arrives late), Deliver.
SPECIFICATION Spec
CONSTANTS
  Items = {"a"}
  MaxAtt = 1
  MaxExec = 1
  AllowAlt = FALSE
  Fault = "no_recheck"
INVARIANTS
  Inv_C_NoSendAfterRunEnded
CHECK_DEADLOCK TRUE
