\* Expected PASS. Smaller bounds for the wake races: one operation, two result identities, two dispatchers (stale holders), attempt cap 2. Same properties as rs-hd-safety; the binding limit and second operations are not covered here.
SPECIFICATION Spec
CONSTANTS
  Deadline = 1
  MaxTime = 2
  Ops = {"o1"}
  Vals = {"X"}
  MaxBindings = 1
  MaxAttempts = 2
  Workers = {"w1", "w2"}
  AllowPurge = FALSE
  Fault = "none"
INVARIANTS
  TypeOK
  Inv_StatusTotal
  Inv_Deadline
  Inv_WinnerBinding
  Inv_NoDecisionAfterExpiry
  Inv_NoLeak
  Inv_WakeWithRecord
  Inv_OneAbandonEvent
PROPERTIES
  Prop_NodeFinal
  Prop_RecordImmutable
  Prop_BindingImmutable
  Prop_DeletedRequesterReadOnly
  Prop_DecideNeedsLiveParties
  Prop_EarlyDecisionWins
  Prop_SettledWakeFinal
  Prop_PeerUntouched
CHECK_DEADLOCK TRUE
