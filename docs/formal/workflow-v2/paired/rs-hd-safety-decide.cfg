\* Expected PASS. Smaller bounds for the decision, binding and authority races: two operations, two result identities (response X, decline), one dispatcher, attempt cap 1. Same properties as rs-hd-safety; stale wake holders are not covered here.
SPECIFICATION Spec
CONSTANTS
  Deadline = 1
  MaxTime = 2
  Ops = {"o1", "o2"}
  Vals = {"X"}
  MaxBindings = 2
  MaxAttempts = 1
  Workers = {"w1"}
  AllowPurge = TRUE
  Fault = "none"
INVARIANTS
  TypeOK
  Inv_StatusTotal
  Inv_Deadline
  Inv_WinnerBinding
  Inv_NoDecisionAfterExpiry
  Inv_NoLeak
  Inv_WakeWithRecord
  Inv_OneAbandonEvent
PROPERTIES
  Prop_NodeFinal
  Prop_RecordImmutable
  Prop_BindingImmutable
  Prop_DeletedRequesterReadOnly
  Prop_DecideNeedsLiveParties
  Prop_EarlyDecisionWins
  Prop_SettledWakeFinal
  Prop_PeerUntouched
CHECK_DEADLOCK TRUE
