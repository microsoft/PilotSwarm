\* Partition, exact for Live_Decides and Live_Collected at the rs-hd-liveness bounds: neither property nor its fairness involves a wake variable, and wake fairness can always be met alongside, so Workers = {} keeps the fair projections. Expected PASS.
SPECIFICATION LiveSpec
CONSTANTS
  Deadline = 1
  MaxTime = 2
  Ops = {"o1"}
  Vals = {"X"}
  MaxBindings = 1
  MaxAttempts = 2
  Workers = {}
  AllowPurge = FALSE
  Fault = "none"
PROPERTIES
  Live_Decides
  Live_Collected
CHECK_DEADLOCK TRUE
